<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

店舗情報管理

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.shop-card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.1);

}

.shop-card h2{

  margin-bottom:20px;

}

.shop-row{

  margin-bottom:18px;

}

.shop-row label{

  display:block;

  margin-bottom:6px;

  font-weight:bold;

}

.shop-row input,
.shop-row textarea{

  width:100%;

  box-sizing:border-box;

}

.shop-row textarea{

  min-height:70px;

  resize:vertical;

}

.preview-image{

  max-width:250px;

  margin-top:10px;

  display:none;

}

.save-btn{

  width:100%;

  padding:14px;

  border:none;

  border-radius:8px;

  background:#28a745;

  color:#fff;

  cursor:pointer;

  font-size:16px;

}

.save-btn:hover{

  opacity:.9;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>

店舗情報管理

</h1>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn"
>

← 管理画面へ戻る

</a>

<br><br>

<div class="shop-card">

<h2>

基本情報

</h2>

<div class="shop-row">

<label>

店舗名

</label>

<input
id="shopName"
>

</div>

<div class="shop-row">

<label>

電話番号

</label>

<input
id="phone"
>

</div>

<div class="shop-row">

<label>

住所

</label>

<input
id="address"
>

</div>

<div class="shop-row">

<label>

営業時間

</label>

<input
id="businessHours"
>

</div>

<div class="shop-row">

<label>

臨時休業日（長期休業等）

</label>

<input
id="holidayList"
readonly
style="background:#f5f5f5;"
>

</div>

<div class="shop-row">

<label>

Instagram

</label>

<input
id="instagram"
>

</div>

<div class="shop-row">

<label>

LINE

</label>

<input
id="line"
>

</div>

<div class="shop-row">

<label>

GoogleMap

</label>

<input
id="googleMap"
>

</div>

<div class="form-group">

<label>

トップ画像

</label>

<input
  id="topImage"
  type="text"
  readonly
>

<br><br>

<label class="image-change-btn">

📷 画像を変更

<input
  type="file"
  id="topImageFile"
  accept="image/*"
>

</label>

<img
  id="topImagePreview"
  class="preview"
>

</div>

<hr>

<h2>

店舗画像

</h2>

<div class="form-group">

<label>

店舗画像１

</label>

<input
  id="shopImage1"
  type="text"
  readonly
>

<br><br>

<label class="image-change-btn">

📷 画像を変更

<input
  type="file"
  id="shopImage1File"
  accept="image/*"
>

</label>

<img
  id="shopImage1Preview"
  class="preview"
>

</div>

<div class="form-group">

<label>

店舗画像２

</label>

<input
  id="shopImage2"
  type="text"
  readonly
>

<br><br>

<label class="image-change-btn">

📷 画像を変更

<input
  type="file"
  id="shopImage2File"
  accept="image/*"
>

</label>

<img
  id="shopImage2Preview"
  class="preview"
>

</div>

<div class="form-group">

<label>

店舗画像３

</label>

<input
  id="shopImage3"
  type="text"
  readonly
>

<br><br>

<label class="image-change-btn">

📷 画像を変更

<input
  type="file"
  id="shopImage3File"
  accept="image/*"
>

</label>

<img
  id="shopImage3Preview"
  class="preview"
>

</div>

<button

class="save-btn"

onclick="saveShopSettings()"

>

保存

</button>

</div>

</div>

<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>

<script src="js/cloudinary.js"></script>

<script src="js/admin-shop.js"></script>

</body>

</html>
