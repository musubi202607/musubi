<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>表示順管理</title>

<link rel="stylesheet" href="css/style.css">

<style>

.sort-info{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.sort-list{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.sort-item{
  background:#fff;
  border-radius:10px;
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.sort-number{
  width:40px;
  min-width:40px;
  height:40px;
  border-radius:50%;
  background:#f0f0f0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

.sort-info-main{
  flex:1;
  min-width:0;
}

.sort-name{
  font-size:17px;
  font-weight:bold;
}

.sort-detail{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.sort-buttons{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.sort-buttons button{
  width:42px;
  height:36px;
  border:none;
  border-radius:6px;
  background:#eee;
  font-size:18px;
  cursor:pointer;
}

.sort-buttons button:disabled{
  opacity:.3;
}

.save-sort-btn{
  width:100%;
  margin-top:20px;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#28a745;
  color:#fff;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.loading{
  text-align:center;
  padding:30px;
}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<div>

<h1 id="pageTitle">
表示順管理
</h1>

<p id="pageDescription">
商品の表示順を管理します
</p>

</div>

</div>

</header>


<main class="container">

<div class="admin-top-buttons">

<a
id="backLink"
class="back-btn"
>
← 管理画面へ戻る
</a>

</div>


<div class="sort-info">

<strong id="sortTarget">
店舗表示順
</strong>

<div style="margin-top:6px;font-size:14px;color:#666;">
上から順番に表示されます。▲▼で並び替えてください。
</div>

</div>


<div
id="sortList"
class="sort-list"
>

<div class="loading">
読み込み中...
</div>

</div>


<button
id="saveSortButton"
class="save-sort-btn"
onclick="saveSortOrder()"
>
表示順を保存
</button>


</main>


<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-product-sort.js"></script>

</body>

</html>
