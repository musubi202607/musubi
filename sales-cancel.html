<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
売上取消
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.search-area{

  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.search-area input{

  margin-bottom:15px;

}

.sale-card{

  background:#fff;
  border-radius:12px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);

}

.sale-header{

  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;

}

.sale-type{

  display:inline-block;
  padding:5px 12px;
  border-radius:20px;
  color:#fff;
  font-size:13px;

}

.sale-type.onigiri{

  background:#43a047;

}

.sale-type.bbq{

  background:#ff7043;

}

.sale-type.bbqoption{

  background:#42a5f5;

}

.sale-total{

  font-size:24px;
  font-weight:bold;
  margin:15px 0;

}

.sale-buttons{

  display:flex;
  gap:10px;
  margin-top:15px;

}

.sale-buttons button{

  flex:1;

}

.cancel-btn{

  background:#dc3545;
  color:#fff;

}

.detail{

  display:none;
  margin-top:15px;
  border-top:1px solid #ddd;
  padding-top:15px;

}

.item-row{

  display:flex;
  justify-content:space-between;
  margin:6px 0;

}

.reason{

  width:100%;
  margin-top:15px;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>

売上取消

</h1>

</div>

</header>

<div class="container">

<a
id="backBtn"
class="back-btn"
href="admin.html"
>

← 戻る

</a>

<div class="search-area">

<label>

開始日

</label>

<input
type="date"
id="startDate"
>

<label>

終了日

</label>

<input
type="date"
id="endDate"
>

<label>

注文番号

</label>

<input
type="text"
id="orderNo"
placeholder="ON000001"
>

<button
onclick="loadSales()"
>

検索

</button>

</div>

<div
id="salesList"
>

読み込み中...

</div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script>

// =========================
// 戻る
// =========================

const from =
new URLSearchParams(
location.search
).get("from");

document
.getElementById("backBtn")
.href =
from==="staff"
? "staff.html"
: "admin.html";


// =========================
// 売上一覧取得
// =========================

async function loadSales(){

const token =
localStorage.getItem(
"adminToken"
);

const res =
await fetch(

API_URL +
"/sales/list",

{

method:"POST",

headers:{

"Content-Type":
"application/json",

Authorization:
"Bearer " + token

},

body:JSON.stringify({

  startDate:
    document.getElementById("startDate").value,

  endDate:
    document.getElementById("endDate").value,

  orderNo:
    document.getElementById("orderNo").value

})

}

);

const data =
await res.json();

const list =
document.getElementById(
"salesList"
);

list.innerHTML="";

if(!Array.isArray(data) ||
data.length===0){

list.innerHTML=
"<p>売上がありません。</p>";

return;

}

for(const sale of data){

let cls="onigiri";

if(sale.type==="BBQ"){

  cls="bbq";

}
else if(sale.type==="BBQ追加"){

  cls="bbqoption";

}

const card =
document.createElement("div");

card.className =
"sale-card";

card.innerHTML=`

<div class="sale-header">

<div>

<div class="sale-type ${cls}">

${sale.type}

</div>

<h3>

${sale.name}

</h3>

</div>

<div>

${sale.salesDate}

</div>

</div>

<div>

注文番号：
<b>

${sale.orderNo}

</b>

</div>

<div class="sale-total">

¥${Number(
sale.amount
).toLocaleString()}

</div>

<div class="detail"

id="detail_${sale.orderNo}">

<div class="item-row">

<span>

数量

</span>

<span>

${sale.qty}

</span>

</div>

<div class="item-row">

<span>

単価

</span>

<span>

¥${Number(
sale.price
).toLocaleString()}

</span>

</div>

<div class="item-row">

<span>

登録日時

</span>

<span>

${sale.created}

</span>

</div>

<textarea

class="reason"

id="reason_${sale.orderNo}"

placeholder="取消理由（空白可）"

></textarea>

</div>

<div class="sale-buttons">

<button

onclick="toggleDetail(

'detail_${sale.orderNo}'

)"

>

詳細

</button>

<button

class="cancel-btn"

onclick="cancelSale(

'${sale.orderNo}'

)"

>

取消

</button>

</div>

`;

list.appendChild(card);

}

}

// =========================
// 詳細表示
// =========================

function toggleDetail(id){

const area =
document.getElementById(id);

area.style.display =

area.style.display === "block"

? "none"

: "block";

}


// =========================
// 売上取消
// =========================

async function cancelSale(orderNo){

if(

!confirm(

orderNo +

" を取消しますか？"

)

){

return;

}

const token =

localStorage.getItem(

"adminToken"

);

const reason =

document.getElementById(

"reason_" + orderNo

)?.value || "";

const res =

await fetch(

API_URL +

"/sales/cancel",

{

method:"POST",

headers:{

"Content-Type":

"application/json",

Authorization:

"Bearer " + token

},

body:JSON.stringify({

orderNo,

reason

})

}

);

const result =

await res.json();

if(result.success){

alert(

"売上を取り消しました。"

);

loadSales();

}else{

alert(

result.message ||

"取消に失敗しました。"

);

}

}

// =========================
// 初期表示
// =========================

const today =
new Date();

const yyyy =
today.getFullYear();

const mm =
String(
today.getMonth()+1
).padStart(2,"0");

const dd =
String(
today.getDate()
).padStart(2,"0");

const todayStr =
`${yyyy}-${mm}-${dd}`;

document.getElementById(
"startDate"
).value = todayStr;

document.getElementById(
"endDate"
).value = todayStr;

loadSales();

</script>

</body>

</html>
