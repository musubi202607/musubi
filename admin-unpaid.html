<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
未会計一覧
</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

table{

  width:100%;

  border-collapse:collapse;

  background:#fff;

}

th,
td{

  border:1px solid #ddd;

  padding:10px;

}

th{

  background:#f5f5f5;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>
未会計一覧
</h1>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn">

← 管理画面へ戻る

</a>

<br><br>

<table>

<thead>

<tr>

<th>
予約番号
</th>

<th>
利用日
</th>

<th>
氏名
</th>

<th>
人数
</th>

<th>
プラン
</th>

<th>
金額
</th>

<th>
状態
</th>

<th>
詳細
</th>

</tr>

</thead>

<tbody id="list">

</tbody>

</table>

</div>

<script src="js/config.js"></script>

<script>

async function loadData(){

  const response =
    await fetch(
      API_URL +
      '?mode=unpaid'
    );

  const data =
    await response.json();

  let html='';

  data.forEach(row=>{

    html += `

    <tr>

      <td>
        ${row.reservationNo}
      </td>

      <td>
        ${row.useDate}
      </td>

      <td>
        ${row.customerName}
      </td>

      <td>
        ${row.people}
      </td>

      <td>
        ${row.plan}
      </td>

      <td>

        ¥${Number(
          row.amount || 0
        ).toLocaleString()}

      </td>

      <td>
        ${row.status}
      </td>

      <td>

        <a href="
          admin-reservation-detail.html
          ?no=${row.reservationNo}
        ">
          開く
        </a>

      </td>

    </tr>

    `;

  });

  document
    .getElementById(
      'list'
    )
    .innerHTML = html;

}

loadData();

</script>

</body>

</html>
