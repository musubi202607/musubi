<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>BBQ予約確認</title>

  <link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<header>

  <div class="container">

    <h1>BBQ予約確認</h1>

  </div>

</header>

<section class="container">

  <h2>
    ご予約日：
    <span id="selectedDate"></span>
  </h2>

  <div id="bbqOrder"></div>

  <input
    type="text"
    id="customerName"
    placeholder="お名前">

  <input
    type="tel"
    id="customerTel"
    placeholder="電話番号">

  <textarea
    id="memo"
    placeholder="備考"></textarea>

  <button onclick="sendBbqOrder()">

    BBQ予約送信

  </button>

  <div style="margin-top:20px;">

    <a href="bbq.html">

      <button>

        戻る

      </button>

    </a>

  </div>

</section>

<script src="js/config.js"></script>
<script src="js/bbq-order.js"></script>

</body>
</html>
