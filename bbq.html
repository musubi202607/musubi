<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BBQ予約確認</title>
</head>

<body>

<h2>予約確認</h2>

<div id="summary"></div>

<button onclick="submitOrder()">予約確定</button>

<script src="js/config.js"></script>

<script>
const data = JSON.parse(localStorage.getItem('bbqReservation'));

document.getElementById('summary').innerHTML = `
  <p>商品: ${data.productName}</p>
  <p>日付: ${data.date}</p>
  <p>金額: ¥${data.price}</p>
`;

async function submitOrder() {

  const body = {
    customerName: prompt("名前"),
    customerTel: prompt("電話番号"),
    people: 1,
    plan: data.productName,
    useDate: data.date,
    memo: ""
  };

  const res = await fetch(API_URL + "/api/reservations", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });

  const result = await res.json();

  if (result.success) {
    alert("予約完了");
    localStorage.removeItem('bbqReservation');
    location.href = "index.html";
  } else {
    alert("失敗");
  }
}
</script>

</body>
</html>
