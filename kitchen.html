<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>キッチンカー注文</title>

<link rel="stylesheet" href="css/style.css">

<link rel="manifest" href="kitchen-manifest.json">

<meta name="theme-color" content="#4CAF50">

</head>

<body>

<header>
<div class="container header-inner">
<h1>キッチンカー注文</h1>
</div>
</header>

<main class="container">

<div class="shop-info-card">

<label>
車両番号
</label>

<select id="carNumber">

<option value="1号車">
1号車
</option>

<option value="2号車">
2号車
</option>

</select>

</div>


<section class="products">

<h2>
商品一覧
</h2>

<div
class="product-grid"
id="kitchenProductGrid">
</div>

</section>


<div class="shop-info-card">

<h2>
注文内容
</h2>

<div id="kitchenCart">

</div>


<div class="sales-value">

合計：
<span id="totalPrice">
¥0
</span>

</div>


<button
onclick="sendKitchenOrder()">

注文確定

</button>


</div>


<div id="resultArea">

</div>


</main>


<script src="js/config.js"></script>
<script src="js/kitchen.js"></script>


<script>

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker.register(
"kitchen-service-worker.js"
);

});

}

</script>


</body>
</html>
