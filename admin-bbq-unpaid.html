<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBQ未会計一覧</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th, td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#f5f5f5;
}

.status-ng{
  color:#dc3545;
  font-weight:bold;
}

.status-ok{
  color:#28a745;
  font-weight:bold;
}

</style>

</head>

<body>

<header>

<div class="container header-inner">
  <h1>BBQ未会計一覧</h1>
</div>

</header>

<div class="container">

<a href="admin.html" class="back-btn">
  ← 管理画面へ戻る
</a>

<br><br>

<table>

<thead>
  <tr>
    <th>予約番号</th>
    <th>氏名</th>
    <th>人数</th>
    <th>BBQ料金</th>
    <th>追加注文</th>
    <th>合計</th>
    <th>会計状態</th>
    <th>詳細</th>
  </tr>
</thead>

<tbody id="result"></tbody>

</table>

</div>

<script src="js/config.js"></script>

<script>

// =========================
// BBQ未会計一覧（Worker版）
// =========================
async function loadData() {

  const res =
    await fetch(API_URL + "/api/bbq/unpaid");

  const data = await res.json();

  let html = '';

  data.forEach(row => {

    const total =
      Number(row.grandTotal || 0);

    html += `
      <tr>

        <td>${row.reservationNo}</td>

        <td>${row.customerName}</td>

        <td>${row.people}</td>

        <td>¥${Number(row.bbqPrice || 0).toLocaleString()}</td>

        <td>¥${Number(row.optionTotal || 0).toLocaleString()}</td>

        <td>¥${Number(row.grandTotal || 0).toLocaleString()}</td>

        <td>

        ${
        row.paid === "済"

        ? `<span class="status-ok">済</span>`

        : `<button
        onclick="setPaid('${row.reservationNo}')">

        未会計

        </button>`

        }

        </td>

        <td>
          <a href="admin-reservation-detail.html?no=${row.reservationNo}">
            開く
          </a>
        </td>

      </tr>
    `;

  });


  document.getElementById('result').innerHTML = html;

}

loadData();

// =========================
// BBQ会計済
// =========================
async function setPaid(reservationNo){

  if(!confirm("会計済にしますか？")){
    return;
  }

  const res =
    await fetch(

      API_URL +
      "/api/bbq/paid",

      {

        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({

          reservationNo

        })

      }

    );

  const result =
    await res.json();

  if(result.success){

    alert("会計済に更新しました");

    loadData();

  }else{

    alert(result.message);

  }

}

</script>

<script src="js/admin-auth.js"></script>

</body>
</html>
