<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>BBQカレンダー管理</title>

<link
rel="stylesheet"
href="css/style.css">

<style>

/* ========================================
   BBQカレンダー専用
======================================== */

.bbq-toolbar{

display:flex;
justify-content:space-between;
align-items:center;

margin-bottom:20px;

}

.bbq-toolbar button{

padding:8px 14px;
font-size:18px;

cursor:pointer;

}

#monthTitle{

font-size:24px;
font-weight:bold;

}

.bbq-calendar{

display:grid;

grid-template-columns:repeat(7,1fr);

gap:8px;

}

.bbq-week{

background:#333;

color:#fff;

text-align:center;

padding:10px;

font-weight:bold;

border-radius:6px;

}

.bbq-cell{

background:#fff;

border:1px solid #ddd;

border-radius:8px;

min-height:110px;

padding:8px;

cursor:pointer;

transition:.2s;

}

.bbq-cell:hover{

box-shadow:0 3px 10px rgba(0,0,0,.15);

}

.bbq-empty{

background:none;

border:none;

cursor:default;

box-shadow:none;

}

.bbq-date{

font-size:20px;

font-weight:bold;

margin-bottom:8px;

}

.bbq-open{

display:inline-block;

padding:3px 8px;

border-radius:20px;

background:#28a745;

color:#fff;

font-size:12px;

margin-bottom:6px;

}

.bbq-close{

display:inline-block;

padding:3px 8px;

border-radius:20px;

background:#dc3545;

color:#fff;

font-size:12px;

margin-bottom:6px;

}

.bbq-limit{

font-size:14px;

color:#666;

}

.bbq-today{

border:2px solid #007bff;

}

/* ===========================
   モーダル
=========================== */

.modal{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:rgba(0,0,0,.45);

justify-content:center;
align-items:center;

z-index:999;

}

.modal-content{

background:#fff;

padding:25px;

border-radius:10px;

width:340px;

max-width:90%;

}

.modal-content h3{

margin-top:0;

}

.modal-content label{

display:block;

margin-top:15px;

margin-bottom:6px;

font-weight:bold;

}

.modal-content input,

.modal-content select{

width:100%;

padding:8px;

box-sizing:border-box;

}

.modal-buttons{

display:flex;

justify-content:flex-end;

gap:10px;

margin-top:20px;

}

.modal-buttons button{

padding:8px 16px;

}

@media(max-width:900px){

.bbq-calendar{

grid-template-columns:repeat(7,1fr);

gap:5px;

}

.bbq-cell{

min-height:90px;

padding:6px;

}

.bbq-date{

font-size:16px;

}

}

@media(max-width:600px){

.bbq-calendar{

gap:3px;

}

.bbq-week{

padding:6px;

font-size:12px;

}

.bbq-date{

font-size:14px;

}

.bbq-open,
.bbq-close{

font-size:10px;

padding:2px 5px;

}

.bbq-limit{

font-size:11px;

}

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>

BBQカレンダー管理

</h1>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn">

← 管理画面へ戻る

</a>

<br><br>

<div class="bbq-toolbar">

<button id="prevMonth">

◀

</button>

<div id="monthTitle">

2026年7月

</div>

<button id="nextMonth">

▶

</button>

</div>

<div
id="calendarBody"
class="bbq-calendar">

</div>

<!-- =========================
     編集モーダル
========================= -->

<div
id="editModal"
class="modal">

<div class="modal-content">

<h3>

BBQ営業日編集

</h3>

<p id="modalDate"></p>

<label>

状態

</label>

<select id="modalStatus">

<option value="○">

予約可

</option>

<option value="×">

予約不可

</option>

</select>

<label>

最大組数

</label>

<input
type="number"
min="0"
id="modalLimit">

<div class="modal-buttons">

<button
id="closeModal">

閉じる

</button>

<button
id="saveModal">

保存

</button>

</div>

</div>

</div>

</div>

<script src="js/config.js"></script>

<script src="js/bbq-calendar.js"></script>

<script src="js/admin-auth.js"></script>

</body>

</html>
