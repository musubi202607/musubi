```html
<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BBQカレンダー管理</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th, td{
  border:1px solid #ddd;
  padding:10px;
}

th{
  background:#f5f5f5;
}

input, select{
  width:100%;
  box-sizing:border-box;
}

button{
  padding:6px 10px;
  cursor:pointer;
}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

    <h1>BBQカレンダー管理</h1>

  </div>

</header>

<div class="container">

<a href="admin.html" class="back-btn">

← 管理画面へ戻る

</a>

<br><br>

<table>

<thead>

<tr>

<th>日付</th>

<th>状態</th>

<th>上限</th>

<th>保存</th>

</tr>

</thead>

<tbody id="calendarBody"></tbody>

</table>

</div>

<script src="js/config.js"></script>

<script>

// =========================
// BBQカレンダー取得
// =========================
async function loadCalendar(){

  try{

    const response =
      await fetch(
        API_URL + "/api/business-calendar"
      );

    const data =
      await response.json();

    let html = "";

    data.forEach(row=>{

      html += `

<tr>

<td>

${row.date}

</td>

<td>

<select
id="status-${row.date}">

<option
value="○"
${row.status==="○"?"selected":""}>

○

</option>

<option
value="×"
${row.status==="×"?"selected":""}>

×

</option>

</select>

</td>

<td>

<input
type="number"
min="0"
id="limit-${row.date}"
value="${row.limit}">

</td>

<td>

<button
onclick="saveCalendar('${row.date}')">

保存

</button>

</td>

</tr>

`;

    });

    document.getElementById(
      "calendarBody"
    ).innerHTML = html;

  }catch(e){

    console.error(e);

    alert("カレンダー取得エラー");

  }

}

// =========================
// BBQカレンダー保存
// =========================
async function saveCalendar(date){

  try{

    const status =
      document.getElementById(
        "status-"+date
      ).value;

    const limit =
      Number(
        document.getElementById(
          "limit-"+date
        ).value
      );

    const res =
      await fetch(

        API_URL +
        "/api/business-calendar",

        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            date,

            status,

            limit

          })

        }

      );

    const result =
      await res.json();

    if(result.success){

      alert("保存しました");

    }else{

      alert(
        result.message ||
        "保存失敗"
      );

    }

  }catch(e){

    console.error(e);

    alert("通信エラー");

  }

}

// 初期表示
loadCalendar();

</script>

</body>
</html>
```
