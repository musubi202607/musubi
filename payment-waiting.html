<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>会計</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.payment-card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.1);

}

.payment-type{

  display:inline-block;

  padding:4px 10px;

  border-radius:20px;

  font-size:12px;

  color:#fff;

  margin-bottom:10px;

}

.payment-type.onigiri{

  background:#4caf50;

}

.payment-type.bbq{

  background:#ff7043;

}

.total{

  font-size:24px;

  font-weight:bold;

  margin-top:10px;

}

.pay-btn{

  width:100%;

  margin-top:15px;

  padding:12px;

  background:#4caf50;

  color:#fff;

  border:none;

  border-radius:8px;

  cursor:pointer;

}

.pay-btn:hover{

  opacity:.9;

}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

    <h1>

      会計

    </h1>

  </div>

</header>

<div class="container">

<a
  href="staff.html"
  class="back-btn"
>

← 店舗メニューへ戻る

</a>

<h2 style="margin:20px 0;">

会計待ち一覧

</h2>

<div id="paymentList">

読み込み中...

</div>

</div>

<script src="js/config.js"></script>

<script src="js/admin-auth.js"></script>

<script>

// =========================
// 会計待ち一覧
// =========================
async function loadPayments(){

  const response =
    await fetch(
      API_URL +
      "/api/payments/waiting"
    );

  const data =
    await response.json();

  let html = "";

  if(data.length===0){

    html=`

<div class="payment-card">

会計待ちはありません

</div>

`;

  }

  // おにぎり→BBQの順に表示
  data.sort((a,b)=>{

    if(
      a.type===b.type
    ) return 0;

    return a.type==="onigiri"
      ? -1
      : 1;

  });

  data.forEach(item=>{

    const total =
      Number(item.total||0);

    const typeName =

      item.type==="onigiri"

      ? "🍙 おにぎり"

      : "🔥 BBQ";

    const typeClass =

      item.type==="onigiri"

      ? "onigiri"

      : "bbq";

    const noLabel =

      item.type==="onigiri"

      ? "注文番号"

      : "予約番号";

    html += `
    
      <div class="payment-card">

        <div class="payment-type ${typeClass}">

          ${typeName}

        </div>

        <h2>

          ${item.customerName}

        </h2>

        <p>

          ${noLabel}：

          ${item.no}

        </p>

        <p>

          ${item.detail || ""}

        </p>

        <div class="total">

          合計：¥${total.toLocaleString()}

        </div>

        <button

          class="pay-btn"

          onclick="paidUpdate(

            '${item.type}',

            '${item.no}'

          )"

        >

          会計済みにする

        </button>

      </div>

    `;

  });

  document.getElementById(

    "paymentList"

  ).innerHTML = html;

}


// =========================
// 会計更新
// =========================
async function paidUpdate(type, no){

  if(!confirm("会計済みにしますか？")){

    return;

  }

  let url = "";
  let body = {};

  // おにぎり
  if(type === "onigiri"){

    url =
      API_URL +
      "/api/onigiri/paid";

    body = {

      orderNo: no

    };

  }

  // BBQ
  else{

    url =
      API_URL +
      "/api/bbq/paid";

    body = {

      reservationNo: no

    };

  }

  const response =
    await fetch(url,{

      method:"POST",

      headers:{

        "Content-Type":
          "application/json"

      },

      body:JSON.stringify(body)

    });

  const result =
    await response.json();

  if(result.success){

    alert("会計済みにしました");

    loadPayments();

  }else{

    alert(

      result.message ||

      "更新失敗"

    );

  }

}


// =========================
// 初期表示
// =========================
loadPayments();

</script>

</body>

</html>
