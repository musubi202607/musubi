<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    注文確認
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>
        注文確認
      </h1>

    </div>

  </div>

</header>

<div class="container">

  <a
    href="cart.html"
    class="back-btn"
  >
    ← カートへ戻る
  </a>

  <a
    href="index.html"
    class="back-btn"
  >
    ← トップページへ戻る
  </a>

  <div
    id="orderItems"
  >
  </div>

  <input
    type="text"
    id="customerName"
    placeholder="お名前"
  >

  <input
    type="tel"
    id="customerTel"
    placeholder="電話番号"
  >

  <textarea
    id="memo"
    placeholder="備考（任意）"
  ></textarea>

  <button
    class="order-btn"
    onclick="sendOrder()"
  >

    注文を送信する

  </button>

</div>

<script src="js/config.js"></script>

<script src="js/cart.js"></script>

<script src="js/order.js"></script>

</body>

</html>
