<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    BBQ追加注文
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>
        BBQ追加注文
      </h1>

      <p>
        当日追加オーダー
      </p>

    </div>

  </div>

</header>

<section class="container">

  <h2>
    予約番号検索
  </h2>

  <input
    type="text"
    id="reservationNo"
    placeholder="予約番号を入力"
  >

  <button
    class="order-btn"
    onclick="searchReservation()"
  >

    検索

  </button>

  <div
    id="reservationDetail"
  >
  </div>

</section>

<section class="container">

  <h2>
    本日のご予約
  </h2>

  <div
    id="reservationList"
  >
  </div>

</section>

<section class="products container">

  <div class="section-title">

    <h2>
      追加メニュー
    </h2>

  </div>

  <div
    class="product-grid"
    id="productGrid"
  >
  </div>

</section>

<section class="container">

  <h2>
    注文内容
  </h2>

  <div
    id="cartArea"
  >
  </div>

  <button
    class="clear-btn"
    onclick="clearCart()"
  >

    カートを空にする

  </button>

  <button
    class="order-btn"
    onclick="sendTabletOrder()"
  >

    追加注文を送信

  </button>

</section>

<script src="js/config.js"></script>

<script src="js/bbq-tablet.js"></script>

</body>

</html>
