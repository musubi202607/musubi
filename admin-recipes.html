<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

レシピ管理

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

/* =========================
   レイアウト
========================= */

.recipe-container{

  display:flex;

  gap:20px;

  align-items:flex-start;

  width:100%;

}

/* =========================
   左：商品一覧
========================= */

.left-panel{

  width:320px;

  flex-shrink:0;

  position:sticky;

  top:20px;

  height:calc(100vh - 40px);

}

.left-panel .card{

  height:100%;

  display:flex;

  flex-direction:column;

  box-sizing:border-box;

}

/* =========================
   商品検索
========================= */

.search-box{

  margin-bottom:15px;

  flex-shrink:0;

}

.search-box input{

  width:100%;

  box-sizing:border-box;

}

/* =========================
   商品一覧
========================= */

.product-list{

  display:flex;

  flex-direction:column;

  gap:10px;

  overflow-y:auto;

  flex:1;

  min-height:0;

  padding-right:5px;

  scrollbar-width:thin;

}

/* Chrome / Edge */
.product-list::-webkit-scrollbar{

  width:8px;

}

.product-list::-webkit-scrollbar-thumb{

  background:#ccc;

  border-radius:10px;

}

.product-list::-webkit-scrollbar-track{

  background:#f5f5f5;

}

/* =========================
   商品カード
========================= */

.product-card{

  background:#fff;

  border-radius:10px;

  padding:15px;

  cursor:pointer;

  border:2px solid transparent;

  transition:.2s;

  flex-shrink:0;

  box-sizing:border-box;

}

.product-card:hover{

  border-color:#4caf50;

}

.product-card.active{

  border-color:#4caf50;

  background:#f1fff2;

}

/* =========================
   右：レシピ編集
========================= */

.right-panel{

  flex:1;

  min-width:0;

  position:sticky;

  top:20px;

}

/* =========================
   レシピ
========================= */

.recipe-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}

.recipe-header h2{

  margin:0;

  min-width:0;

  word-break:break-word;

}

.recipe-summary{

  display:flex;

  gap:20px;

  margin-bottom:20px;

  flex-wrap:wrap;

}

.summary-card{

  background:#fff;

  border-radius:10px;

  padding:15px;

  min-width:180px;

  box-sizing:border-box;

}

/* =========================
   レシピテーブル
========================= */

.recipe-table{

  width:100%;

  border-collapse:collapse;

  table-layout:auto;

}

.recipe-table th,

.recipe-table td{

  border-bottom:1px solid #ddd;

  padding:10px;

  text-align:center;

  vertical-align:middle;

}

.recipe-table th{

  background:#f5f5f5;

  position:sticky;

  top:0;

  z-index:2;

}

/* =========================
   レシピ操作
========================= */

.recipe-actions{

  margin-top:20px;

  display:flex;

  gap:10px;

  flex-wrap:wrap;

}

/* =========================
   モーダル
========================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:999;

  overflow-y:auto;

  padding:20px;

  box-sizing:border-box;

}

.modal-content{

  background:#fff;

  width:100%;

  max-width:700px;

  margin:20px auto;

  border-radius:10px;

  padding:20px;

  box-sizing:border-box;

}

/* =========================
   モーダル内部
========================= */

.modal-body{

  display:flex;

  gap:20px;

  align-items:flex-start;

}

/* =========================
   材料一覧
========================= */

.material-list{

  flex:1;

  min-width:0;

  max-height:350px;

  overflow-y:auto;

  border:1px solid #ddd;

  border-radius:6px;

}

.material-item{

  padding:10px;

  cursor:pointer;

  border-bottom:1px solid #eee;

  box-sizing:border-box;

}

.material-item:last-child{

  border-bottom:none;

}

.material-item:hover{

  background:#f5f5f5;

}

/* =========================
   材料入力
========================= */

.material-form{

  width:260px;

  flex-shrink:0;

}

.material-form input,

.material-form select{

  width:100%;

  margin-bottom:12px;

  box-sizing:border-box;

}

/* =========================
   ボタン
========================= */

.recipe-actions button{

  min-height:40px;

  padding:8px 16px;

}

/* =========================
   タブレット
========================= */

@media(max-width:1100px){

  .recipe-container{

    gap:15px;

  }

  .left-panel{

    width:280px;

  }

  .summary-card{

    min-width:150px;

  }

}

/* =========================
   スマホ
========================= */

@media(max-width:900px){

  .recipe-container{

    flex-direction:column;

    gap:15px;

  }

  /* -------------------------
     商品一覧
  ------------------------- */

  .left-panel{

    width:100%;

    position:static;

    height:auto;

  }

  .left-panel .card{

    height:auto;

    max-height:420px;

  }

  .product-list{

    max-height:300px;

    overflow-y:auto;

  }

  /* -------------------------
     レシピ
  ------------------------- */

  .right-panel{

    width:100%;

    position:static;

  }

  /* -------------------------
     レシピヘッダー
  ------------------------- */

  .recipe-header{

    align-items:flex-start;

    flex-direction:column;

  }

  .recipe-header button{

    width:100%;

  }

  /* -------------------------
     サマリー
  ------------------------- */

  .recipe-summary{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

  }

  .summary-card{

    min-width:0;

    padding:12px;

  }

  /* -------------------------
     レシピテーブル
  ------------------------- */

  .recipe-table{

    display:block;

    overflow-x:auto;

    white-space:nowrap;

  }

  .recipe-table th,

  .recipe-table td{

    padding:8px;

  }

  /* -------------------------
     モーダル
  ------------------------- */

  .modal{

    padding:10px;

  }

  .modal-content{

    margin:10px auto;

    padding:15px;

    max-height:calc(100vh - 20px);

    overflow-y:auto;

  }

  .modal-body{

    flex-direction:column;

    gap:15px;

  }

  /* -------------------------
     材料一覧
  ------------------------- */

  .material-list{

    width:100%;

    max-height:250px;

  }

  /* -------------------------
     材料入力
  ------------------------- */

  .material-form{

    width:100%;

  }

  /* -------------------------
     ボタン
  ------------------------- */

  .recipe-actions{

    width:100%;

  }

  .recipe-actions button{

    flex:1;

    min-width:120px;

  }

}

/* =========================
   小型スマホ
========================= */

@media(max-width:600px){

  .recipe-summary{

    grid-template-columns:1fr;

  }

  .summary-card{

    width:100%;

  }

  .product-card{

    padding:12px;

  }

  .recipe-table th,

  .recipe-table td{

    padding:7px;

    font-size:14px;

  }

  .modal-content{

    padding:12px;

  }

}

/* =========================
   超小型スマホ
========================= */

@media(max-width:400px){

  .recipe-header h2{

    font-size:20px;

  }

  .product-card{

    font-size:14px;

  }

  .recipe-actions{

    flex-direction:column;

  }

  .recipe-actions button{

    width:100%;

  }

}
</style>

</head>

<body>

<div class="container">

<a
  href="admin.html"
  class="back-btn"
>

← 管理画面へ戻る

</a>

<h1>

レシピ管理

</h1>

<p>

商品のレシピ・原価を管理します。

</p>

<div class="recipe-container">

<!-- 左側 -->
<div class="left-panel">

<div class="card">

<div class="search-box">

<input

type="text"

id="searchProduct"

placeholder="商品名で検索..."

oninput="filterProducts()"

>

</div>

<div

id="productList"

class="product-list"

>

</div>

</div>

</div>

<!-- 右側 -->
<div class="right-panel">

<div class="card">

<div class="recipe-header">

<h2

id="recipeTitle"

>

商品を選択してください

</h2>

<button

class="add-btn"

onclick="openMaterialModal()"

>

＋ 材料追加

</button>

</div>

<div

class="recipe-summary"

>

<div class="summary-card">

<div>

販売価格

</div>

<strong

id="recipePrice"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

商品原価

</div>

<strong

id="recipeCost"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

原価率

</div>

<strong

id="recipeCostRate"

>

0 %

</strong>

</div>

</div>

<table

class="recipe-table"

>

<thead>

<tr>

<th>

材料名

</th>

<th>

使用量

</th>

<th>

単位

</th>

<th>

ロス率

</th>

<th>

材料原価

</th>

<th>

操作

</th>

</tr>

</thead>

<tbody

id="recipeBody"

>

<tr>

<td

colspan="6"

>

商品を選択してください。

</td>

</tr>

</tbody>

</table>

<div

class="recipe-actions"

>

<button

type="button"

onclick="saveRecipe()"

>

保存

</button>

</div>

</div>

</div>

</div>

<!-- =========================
     材料追加モーダル
========================= -->

<div

id="materialModal"

class="modal"

>

<div

class="modal-content"

>

<h2>

材料追加

</h2>

<div

class="modal-body"

>

<!-- 左 -->

<div>

<input

type="text"

id="materialSearch"

placeholder="材料名で検索..."

oninput="filterMaterials()"

>

<div

id="modalMaterialList"

class="material-list"

>

</div>

</div>

<!-- 右 -->

<div

class="material-form"

>

<input

type="hidden"

id="selectedMaterialId"

>

<label>

材料名

</label>

<input

id="selectedMaterialName"

readonly

>

<label>

使用量

</label>

<input

type="number"

id="recipeQty"

step="0.001"

>

<label>

使用単位

</label>

<input

id="recipeUnit"

readonly

>

<label>

ロス率(%)

</label>

<input

type="number"

id="recipeLoss"

step="0.1"

value="0"

>

<label>

備考

</label>

<input

id="recipeRemarks"

>

<div

class="recipe-actions"

>

<button

type="button"

onclick="closeMaterialModal()"

>

キャンセル

</button>

<button

type="button"

onclick="addRecipeMaterial()"

>

追加

</button>

</div>

</div>

</div>

</div>

</div>

<script
  src="js/config.js"
></script>

<script
  src="js/admin-auth.js"
></script>

<script
  src="js/recipes.js"
></script>

</body>

</html>
