<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

レシピ管理

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

/* =========================
   レイアウト
========================= */

.recipe-container{

  display:flex;

  gap:20px;

  align-items:flex-start;

  width:100%;

}


/* =========================
   左：商品一覧
========================= */

.left-panel{

  width:320px;

  flex:0 0 320px;

  min-width:320px;

}


/* 左側カード */

.left-panel .card{

  width:100%;

  box-sizing:border-box;

  padding:15px;

}


/* =========================
   商品検索
========================= */

.search-box{

  margin-bottom:12px;

}


.search-box input{

  width:100%;

  box-sizing:border-box;

}


/* =========================
   商品一覧
========================= */

.product-list{

  display:flex;

  flex-direction:column;

  gap:10px;

  width:100%;

  max-height:calc(100vh - 190px);

  overflow-y:auto;

  overflow-x:hidden;

  padding:0;

  box-sizing:border-box;

}


/* スクロールバー */

.product-list::-webkit-scrollbar{

  width:7px;

}


.product-list::-webkit-scrollbar-track{

  background:#f1f1f1;

  border-radius:10px;

}


.product-list::-webkit-scrollbar-thumb{

  background:#bbb;

  border-radius:10px;

}


.product-list::-webkit-scrollbar-thumb:hover{

  background:#999;

}


/* =========================
   商品カード
========================= */

.product-card{

  display:block;

  width:100%;

  min-width:0;

  min-height:78px;

  box-sizing:border-box;

  background:#fff;

  border-radius:10px;

  padding:12px 15px;

  cursor:pointer;

  border:2px solid transparent;

  transition:.2s;

  line-height:1.5;

  overflow:hidden;

}


/* 商品名 */

.product-card strong{

  display:block;

  width:100%;

  font-size:17px;

  line-height:1.5;

  margin:0 0 5px 0;

  color:#222;

  white-space:normal;

  overflow-wrap:anywhere;

  word-break:break-word;

}


/* 商品カード内の文字 */

.product-card{

  font-size:14px;

  color:#444;

}


/* hover */

.product-card:hover{

  border-color:#4caf50;

}


/* 選択中 */

.product-card.active{

  border-color:#4caf50;

  background:#f1fff2;

}


/* =========================
   右：レシピ
========================= */

.right-panel{

  flex:1;

  min-width:0;

}


/* 右側カード */

.right-panel .card{

  width:100%;

  box-sizing:border-box;

}


/* =========================
   レシピヘッダー
========================= */

.recipe-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  margin-bottom:20px;

}


.recipe-header h2{

  margin:0;

  font-size:22px;

}


/* =========================
   レシピ概要
========================= */

.recipe-summary{

  display:flex;

  gap:15px;

  margin-bottom:20px;

  flex-wrap:wrap;

}


.summary-card{

  background:#fff;

  border-radius:10px;

  padding:15px;

  min-width:180px;

  box-sizing:border-box;

}


/* =========================
   レシピテーブル
========================= */

.recipe-table{

  width:100%;

  border-collapse:collapse;

}


.recipe-table th,

.recipe-table td{

  border-bottom:1px solid #ddd;

  padding:10px;

  text-align:center;

}


.recipe-table th{

  background:#f5f5f5;

  white-space:nowrap;

}


/* =========================
   レシピ操作
========================= */

.recipe-actions{

  margin-top:20px;

  display:flex;

  gap:10px;

  flex-wrap:wrap;

}


.recipe-actions button{

  min-height:40px;

}


/* =========================
   モーダル
========================= */

.modal{

  display:none;

  position:fixed;

  inset:0;

  background:rgba(0,0,0,.45);

  z-index:999;

  overflow-y:auto;

}


.modal-content{

  background:#fff;

  width:95%;

  max-width:700px;

  margin:40px auto;

  border-radius:10px;

  padding:20px;

  box-sizing:border-box;

}


.modal-body{

  display:flex;

  gap:20px;

  align-items:flex-start;

}


/* =========================
   材料一覧
========================= */

.material-list{

  flex:1;

  max-height:350px;

  overflow-y:auto;

  overflow-x:hidden;

  border:1px solid #ddd;

  border-radius:6px;

}


.material-item{

  padding:10px;

  cursor:pointer;

  border-bottom:1px solid #eee;

  line-height:1.5;

}


.material-item:last-child{

  border-bottom:none;

}


.material-item:hover{

  background:#f5f5f5;

}


/* =========================
   材料入力
========================= */

.material-form{

  width:260px;

  flex-shrink:0;

}


.material-form input,

.material-form select{

  width:100%;

  margin-bottom:12px;

  box-sizing:border-box;

}


/* =========================
   入力欄
========================= */

input,

select,

button{

  font-size:14px;

}


input,

select{

  min-height:38px;

  box-sizing:border-box;

}


/* =========================
   PC
========================= */

@media(min-width:901px){

  /*
   * 左の商品一覧だけスクロール
   * 右側は通常表示
   */

  .left-panel{

    position:sticky;

    top:20px;

  }


  .product-list{

    max-height:calc(100vh - 190px);

  }


  .right-panel{

    min-height:500px;

  }

}


/* =========================
   タブレット
========================= */

@media(max-width:1100px) and (min-width:901px){

  .left-panel{

    width:300px;

    flex:0 0 300px;

    min-width:300px;

  }


  .product-card{

    padding:12px 14px;

  }


  .product-card strong{

    font-size:16px;

  }


  .summary-card{

    min-width:150px;

  }

}


/* =========================
   スマホ
========================= */

@media(max-width:900px){

  .recipe-container{

    flex-direction:column;

    gap:15px;

  }


  /* -------------------------
     左：商品一覧
  ------------------------- */

  .left-panel{

    width:100%;

    flex:0 0 auto;

    min-width:0;

  }


  .left-panel .card{

    width:100%;

    padding:12px;

  }


  /*
   * スマホでは商品一覧を
   * 独立スクロール
   */

  .product-list{

    width:100%;

    max-height:320px;

    overflow-y:auto;

    overflow-x:hidden;

  }


  .product-card{

    width:100%;

    min-height:78px;

    padding:12px 15px;

  }


  .product-card strong{

    font-size:16px;

    line-height:1.5;

  }


  /* -------------------------
     右：レシピ
  ------------------------- */

  .right-panel{

    width:100%;

    min-width:0;

  }


  /* ヘッダー */

  .recipe-header{

    align-items:flex-start;

    flex-direction:column;

  }


  .recipe-header h2{

    font-size:20px;

  }


  /* -------------------------
     概要
  ------------------------- */

  .recipe-summary{

    gap:10px;

  }


  .summary-card{

    flex:1;

    min-width:140px;

  }


  /* -------------------------
     テーブル
  ------------------------- */

  .recipe-table{

    display:block;

    overflow-x:auto;

    white-space:nowrap;

  }


  .recipe-table th,

  .recipe-table td{

    padding:8px;

  }


  /* -------------------------
     ボタン
  ------------------------- */

  .recipe-actions{

    width:100%;

  }


  .recipe-actions button{

    flex:1;

    min-width:120px;

  }


  /* -------------------------
     モーダル
  ------------------------- */

  .modal-content{

    width:calc(100% - 20px);

    margin:20px auto;

    padding:15px;

  }


  .modal-body{

    flex-direction:column;

    gap:15px;

  }


  .material-list{

    width:100%;

    max-height:250px;

  }


  .material-form{

    width:100%;

  }

}


/* =========================
   小さいスマホ
========================= */

@media(max-width:480px){

  .product-list{

    max-height:280px;

  }


  .product-card{

    min-height:78px;

    padding:11px 13px;

  }


  .product-card strong{

    font-size:16px;

  }


  .recipe-summary{

    flex-direction:column;

  }


  .summary-card{

    width:100%;

  }


  .recipe-header h2{

    font-size:18px;

  }


  .modal-content{

    width:calc(100% - 12px);

    margin:10px auto;

    padding:12px;

  }

}
</style>

</head>

<body>

<div class="container">

<a
  href="admin.html"
  class="back-btn"
>

← 管理画面へ戻る

</a>

<h1>

レシピ管理

</h1>

<p>

商品のレシピ・原価を管理します。

</p>

<div class="recipe-container">

<!-- 左側 -->
<div class="left-panel">

<div class="card">

<div class="search-box">

<input

type="text"

id="searchProduct"

placeholder="商品名で検索..."

oninput="filterProducts()"

>

</div>

<div

id="productList"

class="product-list"

>

</div>

</div>

</div>

<!-- 右側 -->
<div class="right-panel">

<div class="card">

<div class="recipe-header">

<h2

id="recipeTitle"

>

商品を選択してください

</h2>

<button

class="add-btn"

onclick="openMaterialModal()"

>

＋ 材料追加

</button>

</div>

<div

class="recipe-summary"

>

<div class="summary-card">

<div>

販売価格

</div>

<strong

id="recipePrice"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

商品原価

</div>

<strong

id="recipeCost"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

原価率

</div>

<strong

id="recipeCostRate"

>

0 %

</strong>

</div>

</div>

<table

class="recipe-table"

>

<thead>

<tr>

<th>

材料名

</th>

<th>

使用量

</th>

<th>

単位

</th>

<th>

ロス率

</th>

<th>

材料原価

</th>

<th>

操作

</th>

</tr>

</thead>

<tbody

id="recipeBody"

>

<tr>

<td

colspan="6"

>

商品を選択してください。

</td>

</tr>

</tbody>

</table>

<div

class="recipe-actions"

>

<button

type="button"

onclick="saveRecipe()"

>

保存

</button>

</div>

</div>

</div>

</div>

<!-- =========================
     材料追加モーダル
========================= -->

<div

id="materialModal"

class="modal"

>

<div

class="modal-content"

>

<h2>

材料追加

</h2>

<div

class="modal-body"

>

<!-- 左 -->

<div>

<input

type="text"

id="materialSearch"

placeholder="材料名で検索..."

oninput="filterMaterials()"

>

<div

id="modalMaterialList"

class="material-list"

>

</div>

</div>

<!-- 右 -->

<div

class="material-form"

>

<input

type="hidden"

id="selectedMaterialId"

>

<label>

材料名

</label>

<input

id="selectedMaterialName"

readonly

>

<label>

使用量

</label>

<input

type="number"

id="recipeQty"

step="0.001"

>

<label>

使用単位

</label>

<input

id="recipeUnit"

readonly

>

<label>

ロス率(%)

</label>

<input

type="number"

id="recipeLoss"

step="0.1"

value="0"

>

<label>

備考

</label>

<input

id="recipeRemarks"

>

<div

class="recipe-actions"

>

<button

type="button"

onclick="closeMaterialModal()"

>

キャンセル

</button>

<button

type="button"

onclick="addRecipeMaterial()"

>

追加

</button>

</div>

</div>

</div>

</div>

</div>

<script
  src="js/config.js"
></script>

<script
  src="js/admin-auth.js"
></script>

<script
  src="js/recipes.js"
></script>

</body>

</html>
