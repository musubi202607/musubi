<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

レシピ管理

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

/* =========================
   レシピ管理
   レイアウト
========================= */

.recipe-container {

  display: flex;

  gap: 20px;

  align-items: flex-start;

  width: 100%;

}


/* =========================
   左：商品一覧
========================= */

.left-panel {

  width: 300px;

  flex: 0 0 300px;

}


/* 商品一覧カード */

.left-panel > .card {

  padding: 15px;

}


/* 検索 */

.search-box {

  margin-bottom: 12px;

}

.search-box input {

  width: 100%;

  box-sizing: border-box;

}


/* =========================
   商品一覧
========================= */

.product-list {

  display: flex;

  flex-direction: column;

  gap: 6px;

  max-height: calc(100vh - 220px);

  overflow-y: auto;

  padding-right: 4px;

}


/* 商品カード */

.product-card {

  background: #fff;

  border-radius: 8px;

  padding: 10px 12px;

  cursor: pointer;

  border: 2px solid transparent;

  transition: .15s;

  line-height: 1.4;

  box-sizing: border-box;

}


/* 商品名 */

.product-card strong {

  display: block;

  margin-bottom: 3px;

  font-size: 15px;

  line-height: 1.3;

}


/* 商品情報 */

.product-card {

  font-size: 13px;

}


/* ホバー */

.product-card:hover {

  border-color: #4caf50;

}


/* 選択中 */

.product-card.active {

  border-color: #4caf50;

  background: #f1fff2;

}


/* =========================
   右：レシピ
========================= */

.right-panel {

  flex: 1;

  min-width: 0;

}


/* レシピヘッダー */

.recipe-header {

  display: flex;

  justify-content: space-between;

  align-items: center;

  gap: 15px;

  margin-bottom: 20px;

}

.recipe-header h2 {

  margin: 0;

}


/* =========================
   レシピ概要
========================= */

.recipe-summary {

  display: flex;

  gap: 15px;

  margin-bottom: 20px;

  flex-wrap: wrap;

}


.summary-card {

  background: #fff;

  border-radius: 10px;

  padding: 15px;

  min-width: 160px;

  box-sizing: border-box;

}


/* =========================
   レシピテーブル
========================= */

.recipe-table {

  width: 100%;

  border-collapse: collapse;

}


.recipe-table th,

.recipe-table td {

  border-bottom: 1px solid #ddd;

  padding: 10px;

  text-align: center;

}


.recipe-table th {

  background: #f5f5f5;

}


/* =========================
   操作ボタン
========================= */

.recipe-actions {

  margin-top: 20px;

  display: flex;

  gap: 10px;

  flex-wrap: wrap;

}


/* =========================
   モーダル
========================= */

.modal {

  display: none;

  position: fixed;

  inset: 0;

  background: rgba(0, 0, 0, .45);

  z-index: 999;

}


.modal-content {

  background: #fff;

  width: 95%;

  max-width: 700px;

  max-height: 90vh;

  overflow-y: auto;

  margin: 40px auto;

  border-radius: 10px;

  padding: 20px;

  box-sizing: border-box;

}


.modal-body {

  display: flex;

  gap: 20px;

}


/* =========================
   材料一覧
========================= */

.material-list {

  flex: 1;

  max-height: 350px;

  overflow-y: auto;

  border: 1px solid #ddd;

  border-radius: 6px;

}


.material-item {

  padding: 10px;

  cursor: pointer;

  border-bottom: 1px solid #eee;

  line-height: 1.4;

}


.material-item:last-child {

  border-bottom: none;

}


.material-item:hover {

  background: #f5f5f5;

}


/* =========================
   材料入力
========================= */

.material-form {

  width: 260px;

  flex: 0 0 260px;

}


.material-form input,

.material-form select {

  width: 100%;

  margin-bottom: 12px;

  box-sizing: border-box;

}


/* =========================
   PC
========================= */

@media (min-width: 901px) {

  /*
   * 商品一覧だけスクロール
   * 右側は画面上に残る
   */

  .left-panel {

    position: sticky;

    top: 20px;

  }

  .right-panel {

    position: sticky;

    top: 20px;

  }

}


/* =========================
   タブレット
========================= */

@media (min-width: 601px) and (max-width: 900px) {

  .recipe-container {

    gap: 15px;

  }

  .left-panel {

    width: 260px;

    flex-basis: 260px;

  }

  .product-list {

    max-height: calc(100vh - 200px);

  }

  .summary-card {

    min-width: 140px;

  }

}


/* =========================
   スマホ
========================= */

@media (max-width: 600px) {

  .recipe-container {

    flex-direction: column;

    gap: 15px;

  }


  .left-panel {

    width: 100%;

    flex: none;

  }


  /*
   * スマホでは商品一覧を
   * 横に広く使う
   */

  .product-list {

    max-height: 260px;

    overflow-y: auto;

    gap: 5px;

  }


  .product-card {

    padding: 9px 11px;

    border-radius: 7px;

  }


  .product-card strong {

    font-size: 14px;

  }


  .right-panel {

    width: 100%;

  }


  .recipe-header {

    align-items: flex-start;

    flex-direction: column;

  }


  .recipe-header button {

    width: 100%;

  }


  .recipe-summary {

    gap: 8px;

  }


  .summary-card {

    flex: 1;

    min-width: 0;

    padding: 12px;

  }


  /*
   * レシピテーブルは横スクロール
   */

  .recipe-table {

    min-width: 600px;

  }


  .right-panel {

    overflow-x: auto;

  }


  .recipe-actions {

    width: 100%;

  }


  .recipe-actions button {

    flex: 1;

  }


  /* モーダル */

  .modal-content {

    width: 96%;

    max-height: 92vh;

    margin: 20px auto;

    padding: 15px;

  }


  .modal-body {

    flex-direction: column;

  }


  .material-list {

    max-height: 250px;

  }


  .material-form {

    width: 100%;

    flex: none;

  }

}


/* =========================
   極小スマホ
========================= */

@media (max-width: 380px) {

  .product-card {

    padding: 8px 10px;

    font-size: 12px;

  }


  .product-card strong {

    font-size: 13px;

  }


  .summary-card {

    padding: 10px;

  }

}</style>

</head>

<body>

<div class="container">

<a
  href="admin.html"
  class="back-btn"
>

← 管理画面へ戻る

</a>

<h1>

レシピ管理

</h1>

<p>

商品のレシピ・原価を管理します。

</p>

<div class="recipe-container">

<!-- 左側 -->
<div class="left-panel">

<div class="card">

<div class="search-box">

<input

type="text"

id="searchProduct"

placeholder="商品名で検索..."

oninput="filterProducts()"

>

</div>

<div

id="productList"

class="product-list"

>

</div>

</div>

</div>

<!-- 右側 -->
<div class="right-panel">

<div class="card">

<div class="recipe-header">

<h2

id="recipeTitle"

>

商品を選択してください

</h2>

<button

class="add-btn"

onclick="openMaterialModal()"

>

＋ 材料追加

</button>

</div>

<div

class="recipe-summary"

>

<div class="summary-card">

<div>

販売価格

</div>

<strong

id="recipePrice"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

商品原価

</div>

<strong

id="recipeCost"

>

0 円

</strong>

</div>

<div class="summary-card">

<div>

原価率

</div>

<strong

id="recipeCostRate"

>

0 %

</strong>

</div>

</div>

<table

class="recipe-table"

>

<thead>

<tr>

<th>

材料名

</th>

<th>

使用量

</th>

<th>

単位

</th>

<th>

ロス率

</th>

<th>

材料原価

</th>

<th>

操作

</th>

</tr>

</thead>

<tbody

id="recipeBody"

>

<tr>

<td

colspan="6"

>

商品を選択してください。

</td>

</tr>

</tbody>

</table>

<div

class="recipe-actions"

>

<button

type="button"

onclick="saveRecipe()"

>

保存

</button>

</div>

</div>

</div>

</div>

<!-- =========================
     材料追加モーダル
========================= -->

<div

id="materialModal"

class="modal"

>

<div

class="modal-content"

>

<h2>

材料追加

</h2>

<div

class="modal-body"

>

<!-- 左 -->

<div>

<input

type="text"

id="materialSearch"

placeholder="材料名で検索..."

oninput="filterMaterials()"

>

<div

id="modalMaterialList"

class="material-list"

>

</div>

</div>

<!-- 右 -->

<div

class="material-form"

>

<input

type="hidden"

id="selectedMaterialId"

>

<label>

材料名

</label>

<input

id="selectedMaterialName"

readonly

>

<label>

使用量

</label>

<input

type="number"

id="recipeQty"

step="0.001"

>

<label>

使用単位

</label>

<input

id="recipeUnit"

readonly

>

<label>

ロス率(%)

</label>

<input

type="number"

id="recipeLoss"

step="0.1"

value="0"

>

<label>

備考

</label>

<input

id="recipeRemarks"

>

<div

class="recipe-actions"

>

<button

type="button"

onclick="closeMaterialModal()"

>

キャンセル

</button>

<button

type="button"

onclick="addRecipeMaterial()"

>

追加

</button>

</div>

</div>

</div>

</div>

</div>

<script
  src="js/config.js"
></script>

<script
  src="js/admin-auth.js"
></script>

<script
  src="js/recipes.js"
></script>

</body>

</html>
