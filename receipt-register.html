<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
領収書登録
</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>
領収書登録
</h1>

</header>



<main>


<section class="receipt-register">



<!-- =========================
事業区分
========================= -->

<div class="form-group">

<label>
事業区分
</label>


<select id="business-type">

<option value="店舗">
店舗
</option>


<option value="キッチンカー">
キッチンカー
</option>


</select>

</div>





<!-- =========================
勘定科目
========================= -->

<div class="form-group">

<label>
勘定科目
</label>


<select id="category">


<option value="">
選択してください
</option>


<option value="食材">
食材
</option>


<option value="飲料">
飲料
</option>


<option value="消耗品">
消耗品
</option>


<option value="備品">
備品
</option>


<option value="燃料">
燃料
</option>


<option value="車両">
車両
</option>


<option value="広告宣伝費">
広告宣伝費
</option>


<option value="通信費">
通信費
</option>


<option value="水道光熱費">
水道光熱費
</option>


<option value="外注費">
外注費
</option>


<option value="雑費">
雑費
</option>


</select>

</div>





<!-- =========================
領収書画像
カメラ / ファイル選択
========================= -->

<div class="form-group">


<label>
領収書画像
</label>


<div>


<input
id="receipt-camera"
type="file"
accept="image/*"
capture="environment"
style="display:none;"
>


<button
type="button"
id="camera-button"
>

📷 カメラで撮影

</button>


</div>



<div>


<input
id="receipt-image"
type="file"
accept="image/*"
style="display:none;"
>


<button
type="button"
id="file-button"
>

📁 画像を選択

</button>


</div>


</div>





<!-- =========================
画像プレビュー
========================= -->

<div class="image-preview-area">


<img
id="image-preview"
style="
display:none;
max-width:300px;
"
>


</div>


<!-- =========================
OCR結果確認
========================= -->

<section
id="ocr-result"
style="display:none;"
>


<h2>
OCR結果確認
</h2>



<!-- =========================
取引先
========================= -->

<div class="form-group">

<label>
取引先
</label>


<input
id="supplier"
type="text"
>

</div>





<!-- =========================
取引日
========================= -->

<div class="form-group">

<label>
取引日
</label>


<input
id="trade-date"
type="date"
>

</div>





<!-- =========================
税込金額
========================= -->

<div class="form-group">

<label>
税込金額
</label>


<input
id="amount"
type="number"
>

</div>





<!-- =========================
税額
========================= -->

<div class="form-group">

<label>
税額
</label>


<input
id="tax"
type="number"
>

</div>





<!-- =========================
税率
========================= -->

<div class="form-group">

<label>
税率
</label>


<input
id="tax-rate"
type="text"
placeholder="10%"
>

</div>





<!-- =========================
インボイス番号
========================= -->

<div class="form-group">

<label>
インボイス番号
</label>


<input
id="invoice-no"
type="text"
>

</div>





<!-- =========================
支払方法
========================= -->

<div class="form-group">

<label>
支払方法
</label>


<select id="payment-method">


<option value="">
選択してください
</option>


<option value="現金">
現金
</option>


<option value="クレジットカード">
クレジットカード
</option>


<option value="電子マネー">
電子マネー
</option>


<option value="振込">
振込
</option>


</select>


</div>




</section>





<!-- =========================
取引先学習
========================= -->


<div class="form-group">


<label>


<input
type="checkbox"
id="learn-vendor"
checked
>


この取引先を学習する


</label>


</div>






<!-- =========================
保存
========================= -->


<div class="form-group">


<button
id="save-expense"
type="button"
>

保存する

</button>


</div>



</section>



</main>





<script src="js/config.js"></script>

<script src="js/receipt-register.js"></script>



</body>

</html>
