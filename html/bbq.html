<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>BBQ予約</title>

  <link
    rel="stylesheet"
    href="css/style.css">

</head>

<body>

<header>

  <div class="container">

    <h1>BBQ予約</h1>

    <p>
      ご希望日を選択して
      BBQをご予約ください
    </p>

  </div>

</header>

<section class="container">

  <h2>BBQプラン</h2>

  <div id="bbqProducts"></div>

</section>

<section
  class="container"
  id="calendarSection">

  <h2>

    予約可能日

  </h2>

  <div id="calendar" class="calendar-grid"></div>

  <button
    id="goOrder"
    disabled
    onclick="goOrder()">

    予約情報入力へ進む

  </button>

</section>

<script src="js/config.js"></script>
<script src="js/bbq.js"></script>

</body>
</html>
