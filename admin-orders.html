<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>注文履歴</title>

<link rel="stylesheet" href="css/style.css">

<style>

.filter-card{
  background:#fff;
  padding:20px;
  border-radius:10px;
  margin-bottom:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.order-card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.item{
  padding-left:10px;
  font-size:14px;
}

</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <h1>注文履歴</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">
  ← 管理画面へ戻る
</a>

<div class="filter-card">

  <input type="date" id="startDate">
  <input type="date" id="endDate">

  <button onclick="loadOrders()">
    検索
  </button>

</div>

<div id="orderBody"></div>

</div>

<script src="js/config.js"></script>

<script>

async function loadOrders(){

  const response = await fetch(API_URL + "/api/orders");
  const data = await response.json();

  let html = "";

  data.forEach(order => {

    let itemsHtml = "";

    order.items.forEach(i => {
      itemsHtml += `
        <div class="item">
          ・商品ID: ${i.id} × ${i.qty}
        </div>
      `;
    });

    html += `
      <div class="order-card">

        <h3>注文ID: ${order.orderId}</h3>

        <p>日時: ${order.createdAt}</p>

        <p>ステータス: ${order.status}</p>

        <div>
          ${itemsHtml}
        </div>

      </div>
    `;

  });

  document.getElementById("orderBody").innerHTML = html;

}

loadOrders();

</script>

</body>

</html>
