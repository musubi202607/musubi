<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>注文履歴</title>

<link rel="stylesheet" href="css/style.css">

<style>
.order-card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.item{
  font-size:14px;
  padding-left:10px;
}

.total{
  margin-top:10px;
  font-weight:bold;
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <h1>注文履歴</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">← 管理画面へ戻る</a>

<div id="orderBody"></div>

</div>

<script src="js/config.js"></script>

<script>

async function loadOrders(){

  const res = await fetch(API_URL + "/api/orders");
  const orders = await res.json();

  let html = "";

  orders.forEach(order => {

    let itemsHtml = "";
    let total = 0;

    order.items.forEach(i => {

      const price = Number(i.price || 0);
      const subtotal = price * i.qty;

      total += subtotal;

      itemsHtml += `
        <div class="item">
          ・${i.name || "商品"} × ${i.qty}
          （¥${subtotal.toLocaleString()}）
        </div>
      `;
    });

    html += `
      <div class="order-card">

        <h3>注文ID: ${order.orderId}</h3>

        <p>日時: ${order.createdAt}</p>

        <p>状態: ${order.status}</p>

        <div>${itemsHtml}</div>

        <div class="total">
          合計: ¥${total.toLocaleString()}
        </div>

      </div>
    `;
  });

  document.getElementById("orderBody").innerHTML = html;
}

loadOrders();

</script>

</body>
</html>
