<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>注文履歴</title>

<link rel="stylesheet" href="css/style.css">

<style>
.order-card{
  background:#fff;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.item{
  font-size:14px;
  padding-left:10px;
}

.total{
  margin-top:10px;
  font-weight:bold;
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <h1>注文履歴</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">← 管理画面へ戻る</a>

<div id="orderBody"></div>

</div>

<div style="margin:20px 0;">

<button onclick="loadOrders('onigiri')">

おにぎり

</button>

<button onclick="loadOrders('bbq')">

BBQ予約

</button>

<button onclick="loadOrders('option')">

追加注文

</button>

</div>

<script src="js/config.js"></script>

<script>

let currentType = "onigiri";

// =========================
// 一覧取得
// =========================
async function loadOrders(type = "onigiri") {

  const res = await fetch(
    API_URL +
    "/api/orders?type=" +
    type
  );

  const resJson = await res.json();
  const orders = resJson.orders || [];

  let html = "";

  // =========================
  // おにぎり
  // =========================
   if (type === "onigiri") {

    orders.forEach(order => {
      html += `
        <div class="order-card">
          <h3>注文番号 ${order.orderNo}</h3>
          <p>受付：${order.orderDate}</p>
          <p>受取：${order.pickupTime}</p>
          <p>氏名：${order.customerName}</p>
          <p>電話：${order.customerTel}</p>
          <p>商品：${order.itemName}</p>
          <p>数量：${order.qty}</p>
          <p>金額：¥${Number(order.amount).toLocaleString()}</p>
          <p>状態：${order.status}</p>
          <p>会計：${order.paid}</p>
        </div>
      `;
    });

  }

  // =========================
  // BBQ予約
  // =========================
  if (type === "bbq") {

    orders.forEach(order => {
      html += `
        <div class="order-card">
          <h3>予約番号 ${order.reservationNo}</h3>
          <p>利用日：${order.useDate}</p>
          <p>氏名：${order.customerName}</p>
          <p>電話：${order.customerTel}</p>
          <p>人数：${order.people}</p>
          <p>プラン：${order.plan}</p>
          <p>金額：¥${Number(order.price).toLocaleString()}</p>
          <p>状態：${order.status}</p>
          <p>会計：${order.paid}</p>
        </div>
      `;
    });

  }

  // =========================
  // BBQ追加注文
  // =========================
  if (type === "option") {

    orders.forEach(order => {
      html += `
        <div class="order-card">
          <h3>予約番号 ${order.reservationNo}</h3>
          <p>受付：${order.orderDate}</p>
          <p>利用日：${order.useDate}</p>
          <p>氏名：${order.customerName}</p>
          <p>商品：${order.itemName}</p>
          <p>数量：${order.qty}</p>
          <p>金額：¥${Number(order.amount).toLocaleString()}</p>
          <p>状態：${order.status}</p>
          <p>会計：${order.paid}</p>
        </div>
      `;
    });

  }

  document.getElementById("orderBody").innerHTML = html;
}

loadOrders();

</script>

</body>
</html>
