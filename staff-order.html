<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>店舗注文受付</title>

<link
  rel="stylesheet"
  href="css/style.css"
>


<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="default"
>

<meta
  name="apple-mobile-web-app-title"
  content="店舗注文"
>

<link
  rel="apple-touch-icon"
  href="icon.png"
>


<style>

.staff-order-header{

  display:flex;

  justify-content:space-between;

  align-items:center;

  margin-bottom:20px;

}


.staff-order-list{

  display:flex;

  flex-direction:column;

  gap:10px;

}


.staff-product{

  background:#fff;

  padding:15px;

  border-radius:10px;

  box-shadow:
  0 2px 5px rgba(0,0,0,.1);

  display:flex;

  justify-content:space-between;

  align-items:center;

}


.staff-product-name{

  flex:1;

}


.staff-product-price{

  width:80px;

  text-align:right;

}


.qty-area{

  display:flex;

  align-items:center;

  gap:10px;

}


.qty-btn{

  width:40px;

  height:40px;

  font-size:22px;

  border:none;

  border-radius:8px;

  cursor:pointer;

}


.qty-number{

  width:30px;

  text-align:center;

  font-size:18px;

}


.order-total{

  background:#fff;

  padding:20px;

  margin-top:20px;

  border-radius:10px;

  font-size:22px;

  font-weight:bold;

}


.order-form{

  background:#fff;

  padding:20px;

  margin-top:20px;

  border-radius:10px;

}


.order-form input,
.order-form textarea{

  width:100%;

  padding:10px;

  box-sizing:border-box;

  margin-bottom:15px;

}


.order-button{

  width:100%;

  padding:15px;

  font-size:18px;

  border:none;

  border-radius:10px;

  background:#28a745;

  color:white;

}


</style>

</head>


<body>


<header>

<div class="container header-inner">

<h1>
店舗注文受付
</h1>

</div>

</header>



<main class="container">


<div class="staff-order-header">


<a
 href="staff.html"
 class="back-btn"
>
← 店舗メニューへ戻る
</a>


</div>



<div
 id="productList"
 class="staff-order-list"
>

読み込み中...

</div>




<div
class="order-total"
>

合計：

<span id="totalPrice">
0
</span>

円

</div>




<div class="order-form">


<h2>
注文情報
</h2>



<label>
氏名
</label>

<input
id="customerName"
placeholder="お名前"
>




<label>
電話番号
</label>

<input
id="customerPhone"
placeholder="電話番号"
>




<label>
受取時間
</label>

<input
id="pickupTime"
placeholder="例 12:30"
>




<label>
備考
</label>

<textarea
id="note"
rows="3"
placeholder="備考"
></textarea>




<button
class="order-button"
onclick="submitStaffOrder()"
>

注文登録

</button>



</div>



</main>




<script src="js/config.js"></script>

<script src="js/staff-order.js"></script>



</body>

</html>
