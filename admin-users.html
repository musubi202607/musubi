<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>管理者管理</title>

<link rel="stylesheet" href="css/style.css">

<style>

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
}

th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#f5f5f5;
}

.form-area{

  background:#fff;
  margin-top:30px;
  padding:20px;
  border-radius:10px;

}

.form-area input,
.form-area select{

  width:100%;
  padding:10px;
  margin-bottom:15px;

}

.save-btn{

  width:100%;
  padding:12px;
  background:#007bff;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<h1>管理者管理</h1>

</div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn"
>
← 管理画面へ戻る
</a>

<br><br>

<table>

<thead>

<tr>

<th>ID</th>

<th>表示名</th>

<th>権限</th>

<th>状態</th>

<th>操作</th>

</tr>

</thead>

<tbody id="userList">

</tbody>

</table>

<div class="form-area">

<h2>管理者追加</h2>

<label>ログインID</label>

<input
id="id"
type="text"
>

<label>表示名</label>

<input
id="name"
type="text"
>

<label>パスワード</label>

<input
id="password"
type="password"
>

<label>権限</label>

<select id="role">

<option value="staff">
スタッフ
</option>

<option value="owner">
管理者
</option>

</select>

<button
class="save-btn"
onclick="addUser()"
>

登録

</button>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>
<script src="js/admin-users.js"></script>

</body>

</html>
