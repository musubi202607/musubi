<html lang="ja">

<head>

<meta charset="UTF-8">

<meta

  本日の予約一覧
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

table{

  width:100%;

  border-collapse:collapse;

  background:#fff;

}

th,
td{

  border:1px solid #ddd;

  padding:10px;

  text-align:center;

}

th{

  background:#f5f5f5;

}

.status-ok{

  color:green;

  font-weight:bold;

}

.status-ng{

  color:red;

  font-weight:bold;

}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

```
<div>

  <h1>
    本日の予約一覧
  </h1>

</div>
```

  </div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn"

>

```
← 管理画面へ戻る
```

  </a>

<br><br>

  <table>

```
<thead>

  <tr>

    <th>
      予約番号
    </th>

    <th>
      氏名
    </th>

    <th>
      人数
    </th>

    <th>
      プラン
    </th>

    <th>
      来店
    </th>

    <th>
      会計
    </th>

  </tr>

</thead>

<tbody id="reservationBody">

</tbody>
```

  </table>

</div>



<script src="js/config.js"></script>

<script>

const params =
  new URLSearchParams(
    location.search
  );

const reservationNo =
  params.get('no');

async function loadDetail(){
  
  console.log(
  'reservationNo =',
  reservationNo
);
  
  const response =
    await fetch(
      API_URL +
      '?mode=reservation&no=' +
      encodeURIComponent(
        reservationNo
      )
    );

  const data =
    await response.json();

  console.log(data);

  if(!data){

    document
      .getElementById(
        'reservationInfo'
      )
      .innerHTML =
      '<h2>予約が見つかりません</h2>';

    return;

  }

  const historyRes =
    await fetch(

      API_URL +
      '?mode=orderhistory&no=' +
      encodeURIComponent(
        reservationNo
      )

    );

  const history =
    await historyRes.json();

  let html = `

    <h2>
      ${data.customerName}
    </h2>

    <p>
      予約番号：
      ${data.reservationNo}
    </p>

    <p>
      利用日：
      ${data.useDate}
    </p>

    <p>
      人数：
      ${data.people}名
    </p>

    <p>
      プラン：
      ${data.plan}
    </p>

    <p>
      BBQ料金：
      ¥${Number(
        data.price || 0
      ).toLocaleString()}
    </p>

    <p>
      来店状況：
      ${data.status}
    </p>

    <p>
      会計：
      ${data.paid || '未'}
    </p>

  `;

  if(data.paid !== '済'){

    html += `

      <button
        class="order-btn"
        onclick="paidComplete()"
      >

        会計済にする

      </button>

    `;

  }else{

    html += `

      <h3
        style="
          color:green;
          margin-top:15px;
        "
      >

        会計済

      </h3>

    `;

  }

  document
    .getElementById(
      'reservationInfo'
    )
    .innerHTML = html;

  let rows = '';

  if(
    history.items &&
    history.items.length > 0
  ){

    history.items.forEach(item => {

      rows += `

        <tr>

          <td>
            ${item.itemName}
          </td>

          <td>
            ${item.qty}
          </td>

          <td>

            ¥${Number(
              item.amount
            ).toLocaleString()}

          </td>

        </tr>

      `;

    });

  }else{

    rows = `

      <tr>

        <td colspan="3">

          追加注文なし

        </td>

      </tr>

    `;

  }

  const bbqTotal =
    Number(
      data.price || 0
    );

  const optionTotal =
    Number(
      history.total || 0
    );

  const grandTotal =
    bbqTotal + optionTotal;

  document
    .getElementById(
      'orderHistory'
    )
    .innerHTML = `

      <h2>
        追加注文履歴
      </h2>

      <table>

        <tr>

          <th>
            商品
          </th>

          <th>
            数量
          </th>

          <th>
            金額
          </th>

        </tr>

        ${rows}

      </table>

      <br>

      <p>

        BBQ：
        ¥${bbqTotal.toLocaleString()}

      </p>

      <p>

        追加：
        ¥${optionTotal.toLocaleString()}

      </p>

      <h2>

        総合計：
        ¥${grandTotal.toLocaleString()}

      </h2>

    `;

}

async function paidComplete(){

  if(
    !confirm(
      '会計済にしますか？'
    )
  ){
    return;
  }

  try{

    const response =
      await fetch(

        API_URL +
        '?mode=paid&no=' +
        encodeURIComponent(
          reservationNo
        )

      );

    const result =
      await response.json();

    if(result.success){

      alert(
        '会計完了'
      );

      await loadDetail();

    }else{

      alert(
        '更新失敗'
      );

    }

  }catch(error){

    console.error(error);

    alert(
      '通信エラー'
    );

  }

}

loadDetail();

</script>

</body>

</html>
