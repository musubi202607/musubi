<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>
  売上確認
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

.sales-grid{

  display:grid;

  grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

  gap:20px;

  margin-top:20px;

}

.filter-card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  margin-bottom:20px;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.1);

}

.sales-card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  text-align:center;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.1);

}

.sales-card h2{

  margin-bottom:10px;

  font-size:18px;

}

.sales-value{

  font-size:32px;

  font-weight:bold;

  color:#007bff;

}

.summary{

  margin-top:30px;

  background:#fff;

  border-radius:10px;

  padding:20px;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.1);

}

.summary p{

  font-size:18px;

  margin:10px 0;

}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

```
<div>

  <h1>
    売上確認
  </h1>

  <p>
    売上集計
  </p>

</div>
```

  </div>

</header>

<div class="container">

<a
href="admin.html"
class="back-btn"

>

```
← 管理画面へ戻る
```

  </a>

  <div class="filter-card">

```
<h2>
  売上集計
</h2>

<div style="margin-bottom:15px;">

  <button onclick="setToday()">
    今日
  </button>

  <button onclick="setThisMonth()">
    今月
  </button>

  <button onclick="setLastMonth()">
    先月
  </button>

</div>

<input
  type="date"
  id="startDate"
>

<input
  type="date"
  id="endDate"
>

<button onclick="loadSales()">
  集計
</button>
```

  </div>

  <div class="sales-grid">

```
<div class="sales-card">

  <h2>
    BBQ売上
  </h2>

  <div
    class="sales-value"
    id="bbqSales"
  >
    ¥0
  </div>

</div>

<div class="sales-card">

  <h2>
    追加注文売上
  </h2>

  <div
    class="sales-value"
    id="optionSales"
  >
    ¥0
  </div>

</div>

<div class="sales-card">

  <h2>
    総売上
  </h2>

  <div
    class="sales-value"
    id="totalSales"
  >
    ¥0
  </div>

</div>
```

  </div>

  <div class="summary">

```
<h2>
  会計状況
</h2>

<p>

  会計済：
  <span id="paidCount">
    0
  </span>
  件

</p>

<p>

  未会計：
  <span id="unpaidCount">
    0
  </span>
  件

</p>
```

  </div>

</div>

<script src="js/config.js"></script>

<script>

function formatDate(date){

  const y =
    date.getFullYear();

  const m =
    String(
      date.getMonth() + 1
    ).padStart(
      2,
      '0'
    );

  const d =
    String(
      date.getDate()
    ).padStart(
      2,
      '0'
    );

  return `${y}-${m}-${d}`;

}

function setToday(){

  const today =
    formatDate(
      new Date()
    );

  document.getElementById(
    'startDate'
  ).value = today;

  document.getElementById(
    'endDate'
  ).value = today;

  loadSales();

}

function setThisMonth(){

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      1
    );

  document.getElementById(
    'startDate'
  ).value =
    formatDate(start);

  document.getElementById(
    'endDate'
  ).value =
    formatDate(now);

  loadSales();

}

function setLastMonth(){

  const now =
    new Date();

  const start =
    new Date(
      now.getFullYear(),
      now.getMonth() - 1,
      1
    );

  const end =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      0
    );

  document.getElementById(
    'startDate'
  ).value =
    formatDate(start);

  document.getElementById(
    'endDate'
  ).value =
    formatDate(end);

  setThisMonth();

}

async function loadSales(){

  const startDate =
    document.getElementById(
      'startDate'
    ).value;

  const endDate =
    document.getElementById(
      'endDate'
    ).value;

  const response =
    await fetch(

      API_URL +
      '?mode=sales' +
      '&start=' +
      encodeURIComponent(startDate) +
      '&end=' +
      encodeURIComponent(endDate)

    );

  const data =
    await response.json();

  document.getElementById(
    'bbqSales'
  ).innerText =
    '¥' +
    Number(
      data.bbqSales || 0
    ).toLocaleString();

  document.getElementById(
    'optionSales'
  ).innerText =
    '¥' +
    Number(
      data.optionSales || 0
    ).toLocaleString();

  document.getElementById(
    'totalSales'
  ).innerText =
    '¥' +
    Number(
      data.totalSales || 0
    ).toLocaleString();

  document.getElementById(
    'paidCount'
  ).innerText =
    data.paidCount || 0;

  document.getElementById(
    'unpaidCount'
  ).innerText =
    data.unpaidCount || 0;

}

window.onload = function(){

  setToday();

};

</script>

</body>

</html>
