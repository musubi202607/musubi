<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>売上確認</title>

<link rel="stylesheet" href="css/style.css">

<style>
.sales-card{
  background:#fff;
  padding:20px;
  margin:10px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,.1);
  text-align:center;
}

.sales-value{
  font-size:28px;
  font-weight:bold;
  color:#007bff;
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <h1>売上確認</h1>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">← 戻る</a>

<br><br>

<input type="date" id="startDate">
<input type="date" id="endDate">

<button onclick="loadSales()">集計</button>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;">

  <div class="sales-card">
    <h3>おにぎり</h3>
    <div class="sales-value" id="onigiriSales">¥0</div>
  </div>

  <div class="sales-card">
    <h3>BBQ</h3>
    <div class="sales-value" id="bbqSales">¥0</div>
  </div>

  <div class="sales-card">
    <h3>オプション</h3>
    <div class="sales-value" id="optionSales">¥0</div>
  </div>

  <div class="sales-card">
    <h3>合計</h3>
    <div class="sales-value" id="totalSales">¥0</div>
  </div>

</div>

<script src="js/config.js"></script>

<script>

async function loadSales(){

  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  const res = await fetch(API_URL + "/api/sales", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ startDate, endDate })
  });

  const data = await res.json();

  document.getElementById("onigiriSales").innerText =
    "¥" + (data.onigiriSales || 0).toLocaleString();

  document.getElementById("bbqSales").innerText =
    "¥" + (data.bbqSales || 0).toLocaleString();

  document.getElementById("optionSales").innerText =
    "¥" + (data.optionSales || 0).toLocaleString();

  document.getElementById("totalSales").innerText =
    "¥" + (data.totalSales || 0).toLocaleString();
}

</script>

</body>
</html>
