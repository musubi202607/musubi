<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
BBQ店舗端末（POS）
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black"
>

<meta
  name="apple-mobile-web-app-title"
  content="BBQ POS"
>

<link
  rel="apple-touch-icon"
  href="icon.png">

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>

        BBQ店舗端末

      </h1>

      <p>

        予約受付・追加注文

      </p>

    </div>

  </div>

</header>

<div class="tablet-layout container">

  <!-- =========================
       本日の予約
  ========================= -->

  <section class="panel">

    <h2>

      本日の予約

    </h2>

    <div id="reservationList"></div>

  </section>

  <!-- =========================
       現在受付中
  ========================= -->

  <section class="panel">

    <h2>

      受付中

    </h2>

    <div
      id="currentReservation"
      class="current-reservation"
    >

      <div class="empty-state">

        <h3>

          予約を選択してください

        </h3>

        <p>

          本日の予約から選択すると
          商品一覧が表示されます。

        </p>

      </div>

    </div>

  </section>

  <!-- =========================
       商品
  ========================= -->

  <section
    id="productArea"
    class="panel"
  >

    <h2>

      フード

    </h2>

    <div
      id="optionGrid"
      class="product-grid"
    ></div>

    <h2 style="margin-top:30px;">

      ドリンク

    </h2>

    <div
      id="drinkGrid"
      class="product-grid"
    ></div>

  </section>

</div>

<!-- =========================
     カート
========================= -->

<div class="cart-footer">

  <div id="cartArea"></div>

  <div class="cart-buttons">

    <button

      class="btn btn-clear"

      onclick="clearCart()"

    >

      カートを空にする

    </button>

    <button

      class="btn btn-order"

      onclick="sendBbqOptionOrder()"

    >

      注文送信

    </button>

  </div>

</div>

<script src="js/config.js"></script>

<script src="js/bbq-tablet.js"></script>

</body>

</html>
