<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  BBQ店舗端末（POS）
</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<!-- =========================
  iOS / iPad アプリ化設定
========================= -->

<meta
  name="apple-mobile-web-app-capable"
  content="yes"
>

<meta
  name="apple-mobile-web-app-status-bar-style"
  content="black"
>

<meta
  name="apple-mobile-web-app-title"
  content="BBQ POS"
>

<link
  rel="apple-touch-icon"
  href="icon.png"
>

<style>

body{

  margin:0;

}

.layout{

  display:grid;

  grid-template-columns:
    320px
    1fr
    420px;

  gap:20px;

  margin-top:20px;

}

.panel{

  background:#fff;

  border-radius:10px;

  padding:15px;

  box-shadow:
    0 2px 6px
    rgba(0,0,0,.1);

}

#currentReservation{

  background:#fff3cd;

  padding:15px;

  border-radius:10px;

}

.cart-footer{

  position:fixed;

  bottom:0;

  left:0;

  right:0;

  background:#fff;

  border-top:1px solid #ddd;

  padding:15px;

  z-index:999;

}

.cart-buttons{

  display:flex;

  gap:10px;

}

.btn{

  border:none;

  border-radius:8px;

  padding:10px 15px;

  cursor:pointer;

}

.btn-checkin{

  background:#28a745;

  color:#fff;

}

.btn-order{

  background:#007bff;

  color:#fff;

}

.btn-clear{

  background:#dc3545;

  color:#fff;

}

@media(max-width:1200px){

  .layout{

    grid-template-columns:
      1fr;

  }

}

</style>

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>
        BBQ店舗端末
      </h1>

      <p>
        予約選択・受付・追加注文
      </p>

    </div>

  </div>

</header>

<div class="layout container">

  <!-- =========================
    左：本日の予約
  ========================= -->

  <section class="panel">

    <h2>
      本日の予約
    </h2>

    <div id="reservationList"></div>

  </section>

  <!-- =========================
    中央：選択中予約
  ========================= -->

  <section class="panel">

    <h2>
      選択中の予約
    </h2>

    <div id="currentReservation">

      予約を選択してください

    </div>

  </section>

  <!-- =========================
    右：追加メニュー
  ========================= -->

 <section class="panel">

  <h2>
    追加メニュー
  </h2>

  <h3>フード</h3>

  <div
    class="product-grid"
    id="optionGrid"
  ></div>

  <h3>ドリンク</h3>

  <div
    class="product-grid"
    id="drinkGrid"
  ></div>

</section>

<!-- =========================
  カート
========================= -->

<div class="cart-footer">

  <div id="cartArea"></div>

  <div class="cart-buttons">

    <button
      class="btn btn-clear"
      onclick="clearCart()"
    >
      カートを空にする
    </button>

    <button
      class="btn btn-order"
      onclick="sendTabletOrder()"
    >
      注文送信
    </button>

  </div>

</div>

<script src="js/config.js"></script>

<script src="js/bbq-tablet.js"></script>

</body>

</html>
