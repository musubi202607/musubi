<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>

  BBQ店舗端末

</title>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

#currentReservation{

  background:#fff3cd;

  padding:15px;

  border-radius:10px;

  margin-bottom:20px;

}

.reservation-card{

  background:#fff;

  padding:15px;

  margin:10px 0;

  border-radius:10px;

  box-shadow:0 2px 6px rgba(0,0,0,.1);

}

.btn{

  display:inline-block;

  padding:10px 15px;

  margin:5px;

  border:none;

  border-radius:8px;

  cursor:pointer;

}

.btn-order{

  background:#007bff;

  color:#fff;

}

.btn-checkin{

  background:#28a745;

  color:#fff;

}

</style>

</head>

<body>

<header>

<div class="container header-inner">

<div>

<h1>

BBQ店舗端末

</h1>

<p>

予約確認・追加注文

</p>

</div>

</div>

</header>

<section class="container">

<h2>

選択中の予約

</h2>

<div id="currentReservation">

予約を選択してください

</div>

</section>

<section class="container">

<h2>

予約番号検索

</h2>

<input
  type="text"
  id="reservationNo"
  placeholder="予約番号"
>

<button
  class="order-btn"
  onclick="searchReservation()"
>

検索

</button>

<div id="reservationDetail"></div>

</section>

<section class="container">

<h2>

本日の予約

</h2>

<div id="reservationList"></div>

</section>

<section class="products container">

<div class="section-title">

<h2>

追加メニュー

</h2>

</div>

<div
  class="product-grid"
  id="productGrid"
>
</div>

</section>

<section class="container">

<h2>

注文内容

</h2>

<div id="cartArea"></div>

<button
  class="clear-btn"
  onclick="clearCart()"
>

カートを空にする

</button>

<button
  class="order-btn"
  onclick="sendTabletOrder()"
>

追加注文を送信

</button>

</section>

<script src="js/config.js"></script>

<script src="js/bbq-tablet.js"></script>

</body>

</html>
