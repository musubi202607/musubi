<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
BBQ追加注文
</title>


<link
  rel="stylesheet"
  href="css/style.css"
>


</head>


<body>


<header>


<div class="container header-inner">


<div>


<h1>
BBQ追加注文
</h1>


<p>
BBQ予約済みのお客様向け
</p>


</div>


<div>


<a
  href="#"
  id="backTop"
  class="cart-button"
>
戻る
</a>


</div>


</div>


</header>



<div class="container">


<a
  href="#"
  id="backButton"
  class="back-btn"
>

← 戻る

</a>


</div>




<section class="products container">


<div class="section-title">


<h2>
BBQ追加メニュー
</h2>


</div>



<div
  class="product-grid"
  id="productGrid"
>

</div>


</section>




<div class="container">


<a
  href="bbq-option-order.html"
  class="order-btn"
>


注文内容確認へ


</a>


</div>





<script src="js/config.js"></script>

<script src="js/cart.js"></script>

<script src="js/bbq-option.js"></script>



<script>


// =========================
// 戻り先設定
// =========================


const mode =
localStorage.getItem(
  "bbqOptionBack"
);



const backButton =
document.getElementById(
  "backButton"
);


const backTop =
document.getElementById(
  "backTop"
);



if(mode === "tablet"){


backButton.href =
"tablet.html";


backButton.innerHTML =
"← タブレットへ戻る";


backTop.href =
"tablet.html";


backTop.innerHTML =
"タブレット";


}else{


backButton.href =
"staff.html";


backButton.innerHTML =
"← 店舗メニューへ戻る";


backTop.href =
"staff.html";


backTop.innerHTML =
"店舗メニュー";


}



</script>



</body>
</html>
