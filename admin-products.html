<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品管理</title>

<link rel="stylesheet" href="css/style.css">

<style>
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
}

th {
  background: #f5f5f5;
}

input, select {
  width: 100%;
  box-sizing: border-box;
}

.save-btn {
  background: #28a745;
  color: #fff;
  border: none;
  padding: 8px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.add-card {
  background: #fff;
  padding: 20px;
  margin-top: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <div>
      <h1>商品管理</h1>
      <p>商品マスタ編集</p>
    </div>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">← 管理画面へ戻る</a>

<br><br>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>商品名</th>
      <th>価格</th>
      <th>説明</th>
      <th>画像</th>
      <th>種類</th>
      <th>販売状態</th>
      <th>表示順</th>
      <th>保存</th>
      <th>削除</th>
    </tr>
  </thead>

  <tbody id="productList"></tbody>
</table>

<!-- 商品追加 -->
<div class="add-card">

  <h2>商品追加</h2>

  <input id="newName" placeholder="商品名"><br><br>
  <input id="newPrice" type="number" placeholder="価格"><br><br>
  <input id="newDescription" placeholder="説明"><br><br>

  <select id="newType">
    <option value="onigiri">onigiri</option>
    <option value="bbq">bbq</option>
    <option value="bbq-option">bbq-option</option>
    <option value="drink">drink</option>
  </select>

  <br><br>

  <input id="newSort" type="number" placeholder="表示順"><br><br>

  <button onclick="addProduct()">商品追加</button>

</div>

</div>

<script src="js/config.js"></script>

<script>

async function loadProducts() {

  const res =
    await fetch(
      API_URL + '/api/products'
    );

  const data =
    await res.json();

  let html = '';

  data.forEach(item => {

    html += `
      <tr>

        <td>${item.id}</td>

        <td>
          <input
            id="name_${item.id}"
            value="${item.name || ''}"
          >
        </td>

        <td>
          <input
            type="number"
            id="price_${item.id}"
            value="${item.price || 0}"
          >
        </td>

        <td>
          <input
            id="desc_${item.id}"
            value="${item.description || ''}"
          >
        </td>

        <td>
          <input
            id="image_${item.id}"
            value="${item.image || ''}"
          >
        </td>

        <td>
          <select id="type_${item.id}">
            <option value="onigiri"
              ${item.type === 'onigiri' ? 'selected' : ''}>
              onigiri
            </option>

            <option value="bbq"
              ${item.type === 'bbq' ? 'selected' : ''}>
              bbq
            </option>

            <option value="bbq-option"
              ${item.type === 'bbq-option' ? 'selected' : ''}>
              bbq-option
            </option>

            <option value="drink"
              ${item.type === 'drink' ? 'selected' : ''}>
              drink
            </option>
          </select>
        </td>

        <td>
          <select id="status_${item.id}">

            <option
              value="販売中"
              ${item.status === '販売中'
                ? 'selected'
                : ''}
            >
              販売中
            </option>

            <option
              value="停止"
              ${item.status === '停止'
                ? 'selected'
                : ''}
            >
              停止
            </option>

          </select>
        </td>

        <td>
          <input
            type="number"
            id="sort_${item.id}"
            value="${item.sort || ''}"
          >
        </td>

        <td>

          <button
            class="save-btn"
            onclick="saveProduct(${item.id})"
          >
            保存
          </button>

        </td>

        <td>

          <button
            onclick="deleteProduct(${item.id})"
          >
            削除
          </button>

        </td>

      </tr>
    `;

  });

  document.getElementById(
    'productList'
  ).innerHTML = html;

}

// =========================
// 更新
// =========================
async function saveProduct(id) {

  const body = {

    id,

    name:
      document.getElementById(
        'name_' + id
      ).value,

    price:
      document.getElementById(
        'price_' + id
      ).value,

    description:
      document.getElementById(
        'desc_' + id
      ).value,

    image:
      document.getElementById(
        'image_' + id
      ).value,

    type:
      document.getElementById(
        'type_' + id
      ).value,

    status:
      document.getElementById(
        'status_' + id
      ).value,

    sort:
      document.getElementById(
        'sort_' + id
      ).value

  };

  const res =
    await fetch(
      API_URL +
      '/api/products/update',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify(body)
      }
    );

  const result =
    await res.json();

  if (result.ok) {

    alert(
      '保存しました'
    );

  } else {

    alert(
      result.message ||
      '保存失敗'
    );

  }

}

// =========================
// 削除
// =========================
async function deleteProduct(id) {

  if (
    !confirm(
      '削除しますか？'
    )
  ) return;

  const res =
    await fetch(
      API_URL +
      '/api/products/delete',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify({
            id
          })
      }
    );

  const result =
    await res.json();

  if (result.ok) {

    alert('削除しました');

    loadProducts();

  } else {

    alert('削除失敗');

  }

}

// =========================
// 追加
// =========================
async function addProduct() {

  const body = {

    name:
      document.getElementById(
        'newName'
      ).value,

    price:
      document.getElementById(
        'newPrice'
      ).value,

    description:
      document.getElementById(
        'newDescription'
      ).value,

    image: '',

    type:
      document.getElementById(
        'newType'
      ).value,

    sort:
      document.getElementById(
        'newSort'
      ).value,

    status:
      '販売中'

  };

  const res =
    await fetch(
      API_URL +
      '/api/products',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify(body)
      }
    );

  const result =
    await res.json();

  if (result.ok) {

    alert(
      '追加しました'
    );

    loadProducts();

  } else {

    alert(
      result.message ||
      '追加失敗'
    );

  }

}

loadProducts();

</script>

</body>
</html>
