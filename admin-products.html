<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品管理</title>

<link rel="stylesheet" href="css/style.css">

<style>
table {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
}

th, td {
  border: 1px solid #ddd;
  padding: 10px;
}

th {
  background: #f5f5f5;
}

input, select {
  width: 100%;
  box-sizing: border-box;
}

.save-btn {
  background: #28a745;
  color: #fff;
  border: none;
  padding: 8px 15px;
  border-radius: 5px;
  cursor: pointer;
}

.add-card {
  background: #fff;
  padding: 20px;
  margin-top: 20px;
  border-radius: 10px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<header>
  <div class="container header-inner">
    <div>
      <h1>商品管理</h1>
      <p>商品マスタ編集</p>
    </div>
  </div>
</header>

<div class="container">

<a href="admin.html" class="back-btn">← 管理画面へ戻る</a>

<br><br>

  <div 
    id="productList"
    class="product-management-list">
  </div>

<!-- 商品追加 -->
<div class="add-card">

  <h2>商品追加</h2>

  <input id="newName" placeholder="商品名"><br><br>
  <input id="newPrice" type="number" placeholder="価格"><br><br>
  <input id="newDescription" placeholder="説明"><br><br>

  <div id="dropArea" class="drop-area">

  画像をドラッグ＆ドロップ<br>
  またはクリックして選択

  <input
    type="file"
    id="newImageFile"
    accept="image/*"
    capture="environment"
    style="display:none"
  >

  </div><br><br>

  <img id="newPreview" class="preview-image">
  <input id="newImage" readonly
  placeholder="画像を選択するとURLが入ります"
  style="background:#f5f5f5;"><br><br>

  <select id="newType">
    <option value="onigiri">onigiri</option>
    <option value="bbq">bbq</option>
    <option value="bbq-option">bbq-option</option>
    <option value="drink">drink</option>
  </select>

  <br><br>

  <input id="newSort" type="number" placeholder="表示順"><br><br>

  <button id="addButton" onclick="addProduct()">
  商品追加
  </button>

  <div
  id="uploadStatus"
  class="loading">
  </div>

</div>

</div>

<script src="js/config.js"></script>
<script src="js/admin-auth.js"></script>

<script>

// =========================
// 商品画像選択
// =========================
  document
     .getElementById("newImageFile")
     .addEventListener(
     "change",
  async function(e){

    const file =
      e.target.files[0];

    if(!file) return;

    const resizedFile =
      await resizeImage(file);

// =========================
// ドラッグ＆ドロップ
// =========================

const dropArea =
  document.getElementById(
    "dropArea"
  );

dropArea.onclick = () => {

  document
    .getElementById(
      "newImageFile"
    )
    .click();

};

dropArea.addEventListener(
  "dragover",
  e=>{

    e.preventDefault();

    dropArea.classList.add(
      "drag"
    );

  }
);

dropArea.addEventListener(
  "dragleave",
  ()=>{

    dropArea.classList.remove(
      "drag"
    );

  }
);

dropArea.addEventListener(
  "drop",
  e=>{

    e.preventDefault();

    dropArea.classList.remove(
      "drag"
    );

    const files =
      e.dataTransfer.files;

    document
      .getElementById(
        "newImageFile"
      ).files = files;

    document
      .getElementById(
        "newImageFile"
      )
      .dispatchEvent(
        new Event("change")
      );

  }
);

// -------------------------
// プレビュー表示
// -------------------------
      const reader =
        new FileReader();

      reader.onload =
        function(event){

          const preview =
            document.getElementById(
              "newPreview"
            );

          preview.src =
            event.target.result;

          preview.style.display =
            "block";

        };

      reader.readAsDataURL(file);

      // -------------------------
      // Cloudinaryアップロード
      // -------------------------
      const formData =
        new FormData();

      formData.append(
        "file",
        resizedFile
      );

      formData.append(
        "upload_preset",
        "products_upload"
      );

      const button =
        document.getElementById(
          "addButton"
        );

      button.disabled = true;

        document.getElementById(
          "uploadStatus"
        ).textContent =
        "画像アップロード中...";

      const response =
        await fetch(

          "https://api.cloudinary.com/v1_1/i5pbmztl/image/upload",

          {
            method:"POST",
            body:formData
          }

        );

      const result =
        await response.json();

      if(result.secure_url){

        document.getElementById(
          "newImage"
        ).value =
          result.secure_url;

        button.disabled = false;

        document.getElementById(
          "uploadStatus"
        ).textContent =
        "";

        console.log(
          result.secure_url
        );

      }else{

        button.disabled = false;

        document.getElementById(
          "uploadStatus"
        ).textContent =
        "";

        alert(
          "画像アップロード失敗"
        );

        console.log(result);

      }

    }
  );


// =========================
// 画像縮小
// =========================
async function resizeImage(file){

  return new Promise((resolve)=>{

    const img = new Image();

    const reader = new FileReader();

    reader.onload = e=>{

      img.onload = ()=>{

        const MAX = 1200;

        let width = img.width;
        let height = img.height;

        if(width > height){

          if(width > MAX){

            height =
              height * MAX / width;

            width = MAX;

          }

        }else{

          if(height > MAX){

            width =
              width * MAX / height;

            height = MAX;

          }

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        canvas.toBlob(

          blob=>{

            resolve(

              new File(
                [blob],
                file.name,
                {
                  type:"image/jpeg"
                }
              )

            );

          },

          "image/jpeg",

          0.85

        );

      };

      img.src = e.target.result;

    };

    reader.readAsDataURL(file);

  });

}

async function loadProducts() {

  const res =
    await fetch(
      API_URL + '/api/products'
    );

  const data =
    await res.json();

  let html = "";


  data.forEach(item => {


    html += `

<div class="product-card">


  <h3>
    ${item.name || ""}
  </h3>


  <div class="product-card-row">

    <img
      src="${item.image || ""}"
      class="preview-image"
      style="
      display:${item.image ? "block" : "none"};
      "
    >

  </div>



  <div class="product-card-row">

    <label>
      ID
    </label>

    ${item.id}

  </div>



  <div class="product-card-row">

    <label>
      商品名
    </label>

    <input
      id="name_${item.id}"
      value="${item.name || ""}"
    >

  </div>



  <div class="product-card-row">

    <label>
      価格
    </label>

    <input
      type="number"
      id="price_${item.id}"
      value="${item.price || 0}"
    >

  </div>



  <div class="product-card-row">

    <label>
      説明
    </label>

    <input
      id="desc_${item.id}"
      value="${item.description || ""}"
    >

  </div>



  <div class="product-card-row">

    <label>
      画像URL
    </label>

    <input
      id="image_${item.id}"
      value="${item.image || ""}"
      readonly
    >

    <br><br>

    <label
     class="image-change-btn">

     📷 画像を変更

    <input
      type="file"
      id="file_${item.id}"
      accept="image/*"
      capture="environment"
      onchange="uploadProductImage(${item.id})"
    >

    </label>

  </div>

  <div class="product-card-row">

    <label>
      種類
    </label>


    <select id="type_${item.id}">

      <option value="onigiri"
      ${item.type==="onigiri"?"selected":""}>
      onigiri
      </option>


      <option value="bbq"
      ${item.type==="bbq"?"selected":""}>
      bbq
      </option>


      <option value="bbq-option"
      ${item.type==="bbq-option"?"selected":""}>
      bbq-option
      </option>


      <option value="drink"
      ${item.type==="drink"?"selected":""}>
      drink
      </option>


    </select>


  </div>




  <div class="product-card-row">

    <div class="product-card-row">

  <label>
    販売状態
  </label>


  <label class="switch">

    <input
      type="checkbox"
      id="status_${item.id}"
      ${item.status==="販売中" ? "checked" : ""}
    >

    <span></span>

  </label>


</div>




  <div class="product-card-row">

    <label>
      表示順
    </label>

    <input
      type="number"
      id="sort_${item.id}"
      value="${item.sort || ""}"
    >

  </div>




  <div class="product-actions">


  <button
    class="save-btn"
    onclick="saveProduct(${item.id})">

    💾 保存

  </button>



  <button
    class="delete-btn"
    onclick="deleteProduct(${item.id})">

    🗑 削除

  </button>


  </div>


</div>

`;

  });



  document.getElementById(
    "productList"
  ).innerHTML = html;


}

// =========================
// 商品画像変更
// =========================
async function uploadProductImage(id){

  const file =
    document
      .getElementById(
        "file_" + id
      )
      .files[0];

  if(!file) return;

  const formData =
    new FormData();

  formData.append(
    "file",
    file
  );

  formData.append(
    "upload_preset",
    "products_upload"
  );

  const response =
    await fetch(
      "https://api.cloudinary.com/v1_1/i5pbmztl/image/upload",
      {
        method:"POST",
        body:formData
      }
    );

  const result =
    await response.json();

  if(result.secure_url){

    document.getElementById(
      "image_" + id
    ).value =
      result.secure_url;

    const preview =
      document.getElementById(
        "preview_" + id
      );

    preview.src =
      result.secure_url;

    preview.style.display =
      "block";

  }else{

    alert("画像アップロード失敗");

    console.log(result);

  }

}

// =========================
// 更新
// =========================
async function saveProduct(id) {

  const body = {

    id,

    name:
      document.getElementById(
        'name_' + id
      ).value,

    price:
      document.getElementById(
        'price_' + id
      ).value,

    description:
      document.getElementById(
        'desc_' + id
      ).value,

    image:
      document.getElementById(
        'image_' + id
      ).value,

    type:
      document.getElementById(
        'type_' + id
      ).value,

    status:
      document.getElementById(
        'status_' + id
      ).checked
      ? "販売中"
      : "停止",

    sort:
      document.getElementById(
        'sort_' + id
      ).value

  };

  const res =
    await fetch(
      API_URL +
      '/api/products/update',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify(body)
      }
    );

  const result =
    await res.json();

  if (result.success) {

    alert(
      '保存しました'
    );

  } else {

    alert(
      result.message ||
      '保存失敗'
    );

  }

}

// =========================
// 削除
// =========================
async function deleteProduct(id) {

  if (
    !confirm(
      '削除しますか？'
    )
  ) return;

  const res =
    await fetch(
      API_URL +
      '/api/products/delete',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify({
            id
          })
      }
    );

  const result =
    await res.json();

  if (result.success) {

    alert('削除しました');

    loadProducts();

  } else {

    alert('削除失敗');

  }

}

// =========================
// 追加
// =========================
async function addProduct() {

  const body = {

    name:
      document.getElementById(
        'newName'
      ).value,

    price:
      document.getElementById(
        'newPrice'
      ).value,

    description:
      document.getElementById(
        'newDescription'
      ).value,

    image:
      document.getElementById(
       "newImage"
      ).value,

    type:
      document.getElementById(
        'newType'
      ).value,

    sort:
      document.getElementById(
        'newSort'
      ).value,

    status:
      '販売中'

  };

  const res =
    await fetch(
      API_URL +
      '/api/products',
      {
        method: 'POST',
        headers: {
          'Content-Type':
            'application/json'
        },
        body:
          JSON.stringify(body)
      }
    );

  const result =
    await res.json();

    if (result.success) {

      alert("追加しました");

      // 入力欄クリア
      document.getElementById("newName").value = "";
      document.getElementById("newPrice").value = "";
      document.getElementById("newDescription").value = "";
      document.getElementById("newType").value = "onigiri";
      document.getElementById("newSort").value = "";

      await loadProducts();

     } else {

       alert(result.message || "追加失敗");

     }

}

loadProducts();

</script>

</body>
</html>
