<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>おにぎり注文</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>

<body>

<header>

  <div class="container header-inner">

    <div>

      <h1>むすび</h1>

      <p>
        できたて手作りおにぎり
      </p>

    </div>

    <div>

      <a
        href="bbq.html"
        class="cart-button"
      >
        BBQ予約
      </a>

      <a
        href="bbq-option.html"
        class="cart-button"
      >
        BBQ追加注文
      </a>

      <a
        href="cart.html"
        class="cart-button"
      >
        カート

        <span id="cartCount">
          0
        </span>

      </a>

    </div>

  </div>

</header>

<section class="hero">

  <img
    src="images/tenpotop.jpeg"
    alt="店舗画像"
  >

</section>

<section class="shop-gallery container">

  <h2>
    店舗写真
  </h2>

  <div class="gallery-grid">

    <img
      src="images/shop1.jpg"
      alt="店舗写真1"
    >

    <img
      src="images/shop2.jpg"
      alt="店舗写真2"
    >

    <img
      src="images/shop3.jpg"
      alt="店舗写真3"
    >

  </div>

</section>

<section class="products container">

  <div class="section-title">

    <h2>
      商品一覧
    </h2>

  </div>

  <div
    class="product-grid"
    id="productGrid"
  >
  </div>

</section>

<script src="js/config.js"></script>

<script src="js/cart.js"></script>

<script src="js/app.js"></script>

</body>
</html>
