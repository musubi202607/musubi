<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
領収書一覧
</title>

<link rel="stylesheet" href="css/style.css">

<script src="js/config.js"></script>

</head>


<body>


<header>

<div class="container header-inner">

<h1>
領収書一覧
</h1>

</div>

</header>



<main class="container">


<div class="shop-info-card">


<a
id="back-btn"
href="admin.html"
style="
display:inline-block;
margin-bottom:15px;
padding:10px 15px;
background:#666;
color:white;
text-decoration:none;
border-radius:8px;
"
>
← 戻る
</a>




<h2>
検索
</h2>



<div
style="
display:flex;
gap:10px;
margin-bottom:20px;
"
>


<select id="search-year">

<option value="">
年
</option>

</select>



<select id="search-month">

<option value="">
月
</option>

<option value="1">
1月
</option>

<option value="2">
2月
</option>

<option value="3">
3月
</option>

<option value="4">
4月
</option>

<option value="5">
5月
</option>

<option value="6">
6月
</option>

<option value="7">
7月
</option>

<option value="8">
8月
</option>

<option value="9">
9月
</option>

<option value="10">
10月
</option>

<option value="11">
11月
</option>

<option value="12">
12月
</option>

</select>


<button id="search-button">
検索
</button>


</div>





<h2>
領収書一覧
</h2>


<div id="receipt-list">

読み込み中...

</div>



</div>


</main>



<script>


// =========================
// 戻る先設定
// =========================

const params =
new URLSearchParams(
location.search
);


const from =
params.get("from");


const backBtn =
document.getElementById(
"back-btn"
);



if(from === "staff"){

backBtn.href =
"staff.html";

}
else if(from === "kitchen"){

backBtn.href =
"kitchen-index.html";

}
else{

backBtn.href =
"admin.html";

}


</script>



<script src="js/receipt-list.js"></script>


</body>

</html>
